<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loracê Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf9f6;
    --surface: #ffffff;
    --surface-2: #fbf3f0;
    --ink: #33191e;
    --ink-soft: #7a5b60;
    --line: #ecdcdf;
    --brand: #7a2e3a;
    --brand-strong: #5a1f29;
    --accent: #f7c5ce;
    --accent-soft: #fbe4e8;
    --on-brand: #ffffff;
    --ok: #4f6d5a;
    --ok-bg: #e7efe9;
    --warn: #a8742f;
    --danger: #a34848;
    --danger-bg: #f7e6e6;
    --side-a: #5a1f29;
    --side-b: #7a2e3a;
    --shadow: 0 12px 32px -16px rgba(90, 31, 41, .38);
    --r: 22px;
    --brand-2: #c95c7e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1214;
      --surface: #261a1d;
      --surface-2: #2e2023;
      --ink: #f6e9ec;
      --ink-soft: #c4a5ab;
      --line: #3d2a2f;
      --brand: #d2687d;
      --brand-strong: #e8889a;
      --accent: #6e3443;
      --accent-soft: #3a2328;
      --on-brand: #1b1214;
      --ok: #8fb79c;
      --ok-bg: #22322a;
      --warn: #e0b06c;
      --danger: #e98a8a;
      --danger-bg: #3c2224;
      --side-a: #241619;
      --side-b: #3a1f26;
      --shadow: 0 12px 32px -16px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1214;
    --surface: #261a1d;
    --surface-2: #2e2023;
    --ink: #f6e9ec;
    --ink-soft: #c4a5ab;
    --line: #3d2a2f;
    --brand: #d2687d;
    --brand-strong: #e8889a;
    --accent: #6e3443;
    --accent-soft: #3a2328;
    --on-brand: #1b1214;
    --ok: #8fb79c;
    --ok-bg: #22322a;
    --warn: #e0b06c;
    --danger: #e98a8a;
    --danger-bg: #3c2224;
    --side-a: #241619;
    --side-b: #3a1f26;
    --shadow: 0 12px 32px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .serif {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--brand-strong);
  }
  h1 { font-size: 30px; line-height: 1.15; }
  h2 { font-size: 20px; }
  h3 { font-size: 16.5px; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; font-size: 14px; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; min-height: 100dvh; }
  .side {
    width: 228px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--side-a), var(--side-b));
    color: #fdf0f2;
    padding: 26px 14px 18px;
    display: flex; flex-direction: column; gap: 3px;
    position: sticky; top: 0; height: 100vh; height: 100dvh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
  .tag {
    width: 30px; height: 30px; background: #f7c5ce;
    border-radius: 9px 9px 9px 2px; position: relative; flex-shrink: 0;
  }
  .tag::after { content: ''; position: absolute; top: 6px; left: 6px; width: 6px; height: 6px; border-radius: 50%; background: #5a1f29; }
  .brand-name { font-family: 'Fraunces', Georgia, serif; font-size: 19px; color: #fff; line-height: 1.1; }
  .brand-sub { font-size: 10.5px; color: rgba(255,255,255,.72); letter-spacing: .06em; text-transform: uppercase; }
  .nav-btn {
    all: unset; cursor: pointer; box-sizing: border-box;
    padding: 10px 12px; border-radius: 11px;
    font-size: 13.5px; color: rgba(255,255,255,.84);
    display: flex; align-items: center; gap: 11px;
    transition: background .15s ease;
  }
  .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .9; }
  .nav-btn:hover { background: rgba(255,255,255,.08); }
  .nav-btn.active { background: rgba(255,255,255,.17); color: #fff; font-weight: 600; }
  .nav-btn:focus-visible { outline: 2px solid #f7c5ce; outline-offset: 0; }
  .side .spacer { flex: 1; }
  .side-note { font-size: 11px; color: rgba(255,255,255,.66); padding: 10px 10px 0; border-top: 1px solid rgba(255,255,255,.14); margin-top: 6px; }

  main { flex: 1; min-width: 0; padding: 34px 40px 70px; }
  .page { max-width: 1120px; margin: 0 auto; }
  .page[hidden] { display: none; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-head p { margin: 5px 0 0; color: var(--ink-soft); font-size: 13.5px; }
  .eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); font-weight: 600; }

  /* ---------- Generic UI ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
  .card + .card { margin-top: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-head .muted { font-size: 12.5px; }
  .muted { color: var(--ink-soft); }
  .grid-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .btn {
    all: unset; box-sizing: border-box; cursor: pointer;
    background: var(--brand); color: var(--on-brand);
    padding: 9px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap;
    transition: background .15s ease, transform .1s ease;
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  }
  .btn:hover { background: var(--brand-strong); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .btn.secondary { background: transparent; color: var(--brand); box-shadow: inset 0 0 0 1.5px var(--brand); }
  .btn.secondary:hover { background: var(--accent-soft); }
  .btn.ghost { background: transparent; color: var(--ink-soft); padding: 7px 11px; font-weight: 500; }
  .btn.ghost:hover { background: var(--accent-soft); color: var(--brand); }
  .btn.danger-ghost { background: transparent; color: var(--danger); font-weight: 500; }
  .btn.danger-ghost:hover { background: var(--danger-bg); }
  .btn.sm { padding: 6px 12px; font-size: 12.5px; }
  .icon-btn {
    all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 9px;
    display: inline-grid; place-items: center; color: var(--ink-soft); flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--brand); }
  .icon-btn:focus-visible { outline: 2px solid var(--brand); }
  .icon-btn svg { width: 16px; height: 16px; }

  .input, .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--surface-2);
  }
  .input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .fields .field.full { grid-column: 1 / -1; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    all: unset; cursor: pointer; box-sizing: border-box;
    padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
    background: var(--surface); border: 1.5px solid var(--line); color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .chip:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .chip .count { font-size: 11px; opacity: .75; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--brand)); flex-shrink: 0; display: inline-block; }
  .tagpill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
  }
  :root[data-theme="dark"] .tagpill { color: color-mix(in srgb, var(--c) 55%, white); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tagpill { color: color-mix(in srgb, var(--c) 55%, white); } }

  .empty { text-align: center; padding: 26px 14px; color: var(--ink-soft); font-size: 13.5px; }
  .empty .tag { margin: 0 auto 10px; }

  .check {
    appearance: none; -webkit-appearance: none; margin: 0; cursor: pointer;
    width: 20px; height: 20px; border-radius: 7px; flex-shrink: 0;
    border: 1.8px solid var(--c, var(--brand)); background: transparent;
    display: grid; place-items: center; transition: background .15s ease;
  }
  .check::after { content: ''; width: 9px; height: 5px; border: 2px solid var(--on-brand); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
  .check:checked { background: var(--c, var(--brand)); }
  .check:checked::after { opacity: 1; }

  .progress { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
  .progress > span { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--brand)); transition: width .35s ease; }

  /* ---------- Hoje ---------- */
  .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .hero h1 { font-size: 34px; }
  .countdown { text-align: right; }
  .countdown strong { font-family: 'Fraunces', Georgia, serif; font-size: 30px; color: var(--brand); display: block; line-height: 1; }
  .affirm { background: linear-gradient(135deg, var(--accent-soft), var(--surface)); border-color: var(--accent); }
  .affirm p { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.35; margin: 6px 0 0; color: var(--brand-strong); }
  .focus-input { font-family: 'Fraunces', Georgia, serif; font-size: 18px; border: 0; border-bottom: 1.5px dashed var(--line); border-radius: 0; background: transparent; padding: 6px 0; width: 100%; }
  .focus-input:focus { outline: none; border-bottom-color: var(--brand); }
  .moods { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .mood { all: unset; cursor: pointer; font-size: 12px; padding: 6px 11px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--ink-soft); display: inline-flex; gap: 6px; align-items: center; }
  .mood span { font-size: 16px; }
  .mood.on { border-color: var(--brand); background: var(--accent-soft); color: var(--brand-strong); font-weight: 600; }
  .mood:focus-visible { outline: 2px solid var(--brand); }

  .ev { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ev:last-child { border-bottom: 0; }
  .ev-time { width: 70px; flex-shrink: 0; font-weight: 600; font-size: 13px; color: var(--brand-strong); font-variant-numeric: tabular-nums; }
  .ev-time small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 11.5px; }
  .ev-body { flex: 1; min-width: 0; border-left: 3px solid var(--c); padding-left: 10px; }
  .ev-title { font-weight: 600; }
  .ev.done .ev-title { text-decoration: line-through; color: var(--ink-soft); }
  .ev-notes { color: var(--ink-soft); font-size: 12.5px; white-space: pre-wrap; }
  .ev-actions { display: flex; align-items: center; gap: 2px; }

  .task { display: flex; align-items: center; gap: 11px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .task-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .task.done .task-text { text-decoration: line-through; color: var(--ink-soft); }
  .task-meta { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--ink-soft); flex-shrink: 0; }
  .task-meta .late { color: var(--danger); font-weight: 600; }
  .prio { color: var(--danger); font-weight: 700; font-size: 11px; letter-spacing: .03em; }
  .quick-add { display: flex; gap: 8px; margin-top: 10px; }
  .quick-add .input { flex: 1; }

  .habits { width: 100%; border-collapse: collapse; }
  .habits th { font-size: 10.5px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; padding: 0 0 6px; text-align: center; }
  .habits th:first-child { text-align: left; }
  .habits th.today { color: var(--brand); }
  .habits td { padding: 4px 0; text-align: center; }
  .habits td:first-child { text-align: left; font-size: 13px; padding-right: 8px; }
  .habit-name { all: unset; cursor: pointer; overflow-wrap: anywhere; }
  .habit-name:hover { color: var(--brand); text-decoration: underline; }
  .hcell { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--line); display: inline-grid; place-items: center; box-sizing: border-box; }
  .hcell.on { background: var(--brand); border-color: var(--brand); }
  .hcell.on::after { content: ''; width: 8px; height: 4px; border: 2px solid var(--on-brand); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
  .hcell[disabled] { opacity: .35; cursor: default; }
  .hcell:focus-visible { outline: 2px solid var(--brand); }

  .mini-goal { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .mini-goal:last-child { border-bottom: 0; }
  .mini-goal .row { justify-content: space-between; margin-bottom: 6px; font-size: 13px; }

  /* ---------- Agenda ---------- */
  .week-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .week-nav h2 { flex: 1; text-transform: capitalize; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
  .day {
    all: unset; cursor: pointer; box-sizing: border-box; text-align: center;
    padding: 10px 4px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface);
  }
  .day:hover { border-color: var(--accent); }
  .day:focus-visible { outline: 2px solid var(--brand); }
  .day .dw { font-size: 11px; text-transform: uppercase; color: var(--ink-soft); letter-spacing: .04em; }
  .day .dn { font-family: 'Fraunces', Georgia, serif; font-size: 22px; color: var(--ink); line-height: 1.2; }
  .day .dots { display: flex; justify-content: center; gap: 3px; height: 6px; margin-top: 3px; }
  .day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
  .day.today .dn { color: var(--brand); }
  .day.sel { background: var(--brand); border-color: var(--brand); }
  .day.sel .dw, .day.sel .dn { color: var(--on-brand); }
  .day.sel .dots i { background: var(--on-brand); }

  .month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .month .mh { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; padding: 4px 0; }
  .mday { all: unset; cursor: pointer; padding: 6px 0 8px; border-radius: 9px; font-size: 12.5px; position: relative; font-variant-numeric: tabular-nums; }
  .mday:hover { background: var(--accent-soft); }
  .mday:focus-visible { outline: 2px solid var(--brand); }
  .mday.out { color: var(--ink-soft); opacity: .45; }
  .mday.today { color: var(--brand); font-weight: 700; }
  .mday.sel { background: var(--brand); color: var(--on-brand); }
  .mday.has::after { content: ''; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--brand); }
  .mday.sel.has::after { background: var(--on-brand); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-soft); margin-top: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .repeat-badge { font-size: 11px; color: var(--ink-soft); }

  /* ---------- Tarefas ---------- */
  .task-add { display: grid; grid-template-columns: 1fr 130px 150px auto; gap: 8px; }
  .tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; border: 1px solid var(--line); }
  .tab { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; color: var(--ink-soft); }
  .tab.on { background: var(--surface); color: var(--brand-strong); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tab:focus-visible { outline: 2px solid var(--brand); }

  /* ---------- Metas ---------- */
  .goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .goal { display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--c); }
  .goal-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .goal h3 { font-size: 18px; }
  .goal-why { font-family: 'Fraunces', Georgia, serif; font-style: italic; color: var(--ink-soft); font-size: 13.5px; margin: 0; }
  .goal-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); }
  .goal-meta strong { color: var(--ink); }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { display: flex; gap: 10px; align-items: center; padding: 5px 0; font-size: 13.5px; }
  .steps li.done span { text-decoration: line-through; color: var(--ink-soft); }
  .steps li span { flex: 1; overflow-wrap: anywhere; }
  .steps li .icon-btn { width: 24px; height: 24px; opacity: 0; }
  .steps li:hover .icon-btn, .steps li .icon-btn:focus-visible { opacity: 1; }
  .step-add { display: flex; gap: 6px; }
  .step-add .input { padding: 7px 10px; font-size: 13px; }
  .won { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--ok); background: var(--ok-bg); padding: 3px 10px; border-radius: 999px; }
  .goal.is-won { background: linear-gradient(180deg, var(--ok-bg), var(--surface) 40%); }

  /* ---------- Vision board ---------- */
  .vb-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .vb-toolbar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  .vb-wrap { position: relative; width: 100%; aspect-ratio: 3 / 2; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); touch-action: none; }
  .vb-board { position: absolute; left: 0; top: 0; width: 1200px; height: 800px; transform-origin: 0 0; }
  .vb-board.bg-creme { background: #f6efe8 radial-gradient(#e8dccf 1px, transparent 1.4px) 0 0 / 22px 22px; }
  .vb-board.bg-rosa { background: #f7dfe3 radial-gradient(#efc6ce 1px, transparent 1.4px) 0 0 / 22px 22px; }
  .vb-board.bg-cortica { background: #c9a27a radial-gradient(#b48c63 1.4px, transparent 1.8px) 0 0 / 14px 14px; }
  .vb-board.bg-menta { background: #dfece4 radial-gradient(#c8dccf 1px, transparent 1.4px) 0 0 / 22px 22px; }
  .vb-board.bg-noite { background: #2b1a1f radial-gradient(#3e272e 1px, transparent 1.4px) 0 0 / 22px 22px; }
  .vb-title { position: absolute; left: 0; right: 0; top: 26px; text-align: center; font-family: 'Fraunces', Georgia, serif; font-size: 44px; font-weight: 600; color: #5a1f29; pointer-events: none; opacity: .9; }
  .bg-noite .vb-title { color: #f7c5ce; }
  .vb-item { position: absolute; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
  .vb-item.dragging { cursor: grabbing; }
  .vb-item.t-img { background: #fff; padding: 10px 10px 10px; box-shadow: 0 10px 24px -10px rgba(40,10,20,.45); }
  .vb-item.t-img img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; background: #eee; }
  .vb-item.t-quote { background: #fff; padding: 22px 24px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 10px 24px -12px rgba(40,10,20,.4); border-radius: 4px; }
  .vb-item.t-quote p { margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 24px; line-height: 1.3; color: #5a1f29; overflow-wrap: anywhere; }

  /* =========================================================

  body {

  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* storage unavailable */ }
    return null;
  }

  function migrate(s) {
    const base = seed();
    if (!s || typeof s !== 'object') return base;
    for (const k of Object.keys(base)) if (s[k] === undefined) s[k] = base[k];
    s.ui = Object.assign({}, base.ui, s.ui || {});
    s.tasks.lists = s.tasks.lists || base.tasks.lists;
    s.tasks.items = s.tasks.items || [];
    s.vision.items = s.vision.items || [];
    if (!s.maps.length) s.maps = base.maps;
    return s;
  }

  let S = migrate(loadState());
  if (!S.mapSel || !S.maps.find((m) => m.id === S.mapSel)) S.mapSel = S.maps[0].id;

  function save() {
    clearTimeout(saveTimer);

    const root = document.documentElement;
    const dark = mode === 'dark' || (mode === 'auto' && darkMQ && darkMQ.matches);
    if (mode === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);

  function fieldHTML(f) {
    const v = f.value ?? '';

      input = `<select id="${id}" name="${f.name}">${f.options.map((o) => `<option value="${esc(o.value)}" ${String(o.value) === String(v) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    } else if (f.type === 'swatch') {
      input = `<div class="swatches" role="radiogroup" aria-label="${esc(f.label)}">${f.options.map((c) => `<label class="sw" style="--c:${c}"><input type="radio" name="${f.name}" value="${c}" ${c === v ? 'checked' : ''} aria-label="${c}"><span></span></label>`).join('')}</div>`;
    } else {
      input = `<input id="${id}" type="${f.type || 'text'}" name="${f.name}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}" ${f.type === 'url' ? 'inputmode="url"' : ''}>`;
    }
    return `<div class="field ${f.full ? 'full' : ''}"><label for="${id}">${esc(f.label)}</label>${input}</div>`;
  }

  function modal({ title, message, fields = [], saveLabel = 'Salvar', danger = false, onSave, onDelete, extraHTML = '', onOpen }) {
    const twoCol = fields.length > 2;
    dlg.innerHTML = `<form class="md" novalidate>
      <h2>${esc(title)}</h2>
      ${message ? `<p class="msg">${esc(message)}</p>` : ''}
      <div class="${twoCol ? 'fields' : ''}">${fields.map((f) => fieldHTML(Object.assign({ full: !twoCol || f.full }, f))).join('')}</div>
      ${extraHTML}
      <div class="md-actions">
        ${onDelete ? '<button type="button" class="btn danger-ghost" data-act="del">Excluir</button>' : ''}
        <span class="sp"></span>
        <button type="button" class="btn ghost" data-act="cancel">Cancelar</button>
        ${onSave ? `<button type="submit" class="btn ${danger ? 'danger' : ''}" ${danger ? 'style="background:var(--danger)"' : ''}>${esc(saveLabel)}</button>` : ''}
      </div>
    </form>`;
    const form = $('form', dlg);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const vals = Object.fromEntries(new FormData(form).entries());
      for (const f of fields) {
        if (f.required && !String(vals[f.name] || '').trim()) {
          toast(`Preencha “${f.label}”.`);
          const el = form.elements[f.name];
          if (el && el.focus) el.focus();
          return;
        }
      }
      const ok = onSave ? onSave(vals) : true;
      if (ok !== false) dlg.close();
    });
    on(form, 'click', '[data-act]', (e, b) => {
      if (b.dataset.act === 'cancel') dlg.close();
      if (b.dataset.act === 'del') { dlg.close(); onDelete(); }
    });
    if (onOpen) onOpen(form);
    dlg.showModal();
    const first = form.querySelector('input:not([type=radio]), textarea, select');
    if (first) setTimeout(() => first.focus(), 30);
  }

  function confirmBox(title, message, onYes, label = 'Excluir') {
    modal({ title, message, saveLabel: label, danger: true, onSave: () => { onYes(); } });
  }

  /* =========================================================
     Router
     ========================================================= */
  const PAGES = {};
  let current = 'hoje';
  function go(p) {
    if (!PAGES[p]) p = 'hoje';
    current = p;
    $$('.nav-btn[data-page]').forEach((b) => {
      b.classList.toggle('active', b.dataset.page === p);
      if (b.dataset.page === p) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $$('main > .page').forEach((s) => { s.hidden = s.id !== 'pg-' + p; });
    PAGES[p].render();
    try { history.replaceState(null, '', '#' + p); } catch (e) {}
    window.scrollTo(0, 0);
  }
  on(document.querySelector('.side'), 'click', '.nav-btn[data-page]', (e, b) => go(b.dataset.page));

  /* =========================================================
     Shared: events & tasks logic
     ========================================================= */
  function occurs(ev, date) {
    if (date < ev.date) return false;
    switch (ev.repeat || 'none') {
      case 'daily': return true;
      case 'weekdays': { const d = dow(date); return d >= 1 && d <= 5; }
      case 'weekly': return dow(date) === dow(ev.date);
      case 'monthly': return parseISO(date).getDate() === parseISO(ev.date).getDate();
      default: return date === ev.date;
    }
  }
  const eventsOn = (date) => S.events.filter((e) => occurs(e, date)).sort((a, b) => (a.start || '99').localeCompare(b.start || '99'));
  const isEvDone = (ev, date) => !!(ev.doneDates && ev.doneDates[date]);

  function eventRow(ev, date, compact) {
    const c = (CATS[ev.cat] || CATS.pessoal).color;
    const done = isEvDone(ev, date);
    return `<div class="ev ${done ? 'done' : ''}" style="--c:${c}">
      <div class="ev-time">${ev.start ? esc(ev.start) : '<span class="muted">dia todo</span>'}${ev.end ? `<small>até ${esc(ev.end)}</small>` : ''}</div>
      <div class="ev-body">
        <div class="ev-title">${esc(ev.title)}</div>
        ${!compact && ev.notes ? `<div class="ev-notes">${esc(ev.notes)}</div>` : ''}
        <div class="row" style="gap:8px;margin-top:2px"><span class="tagpill" style="--c:${c}">${esc((CATS[ev.cat] || CATS.pessoal).label)}</span>${ev.repeat && ev.repeat !== 'none' ? `<span class="repeat-badge">↻ ${esc(REPEATS[ev.repeat])}</span>` : ''}</div>
      </div>
      <div class="ev-actions">
        <input type="checkbox" class="check" style="--c:${c}" data-ev-done="${ev.id}" data-date="${date}" ${done ? 'checked' : ''} aria-label="Concluído">
        <button class="icon-btn" data-ev-edit="${ev.id}" aria-label="Editar compromisso">${ICON.edit}</button>
      </div>
    </div>`;
  }

  function eventModal(ev, date) {
    const isNew = !ev;
    ev = ev || { date: date || today(), start: '', end: '', title: '', cat: 'pessoal', notes: '', repeat: 'none' };
    modal({
      title: isNew ? 'Novo compromisso' : 'Editar compromisso',
      fields: [
        { name: 'title', label: 'O que é?', value: ev.title, required: true, full: true, placeholder: 'Ex: Aula de pilates' },
        { name: 'date', label: 'Data', type: 'date', value: ev.date, required: true },
        { name: 'cat', label: 'Categoria', type: 'select', value: ev.cat, options: Object.entries(CATS).map(([k, v]) => ({ value: k, label: v.label })) },
        { name: 'start', label: 'Começa', type: 'time', value: ev.start },
        { name: 'end', label: 'Termina', type: 'time', value: ev.end },
        { name: 'repeat', label: 'Repetir', type: 'select', value: ev.repeat || 'none', full: true, options: Object.entries(REPEATS).map(([k, v]) => ({ value: k, label: v })) },
        { name: 'notes', label: 'Anotações', type: 'textarea', value: ev.notes, full: true, rows: 2, placeholder: 'Endereço, o que levar…' },
      ],
      onSave: (v) => {
        if (isNew) S.events.push({ id: uid(), doneDates: {}, ...v });
        else Object.assign(ev, v);
        save(); rerender();
        toast(isNew ? 'Compromisso adicionado.' : 'Compromisso atualizado.');
      },
      onDelete: isNew ? null : () => confirmBox('Excluir compromisso?', ev.repeat && ev.repeat !== 'none' ? 'Ele se repete — todas as repetições serão removidas.' : `“${ev.title}” será removido.`, () => {
        S.events = S.events.filter((x) => x.id !== ev.id); save(); rerender();
      }),
    });
  }

  function bindEventActions(root) {
    on(root, 'change', '[data-ev-done]', (e, el) => {
      const ev = S.events.find((x) => x.id === el.dataset.evDone);
      if (!ev) return;
      ev.doneDates = ev.doneDates || {};
      if (el.checked) ev.doneDates[el.dataset.date] = true; else delete ev.doneDates[el.dataset.date];
      save(); rerender();
    });
    on(root, 'click', '[data-ev-edit]', (e, el) => eventModal(S.events.find((x) => x.id === el.dataset.evEdit)));
  }

  const listById = (id) => S.tasks.lists.find((l) => l.id === id) || S.tasks.lists[0] || { name: 'Lista', color: '#c0587a' };

  function taskRow(it, showList) {
    const l = listById(it.listId);
    const t = today();
    const late = !it.done && it.due && it.due < t;
    const dueLabel = it.due ? (it.due === t ? 'hoje' : it.due === addDays(t, 1) ? 'amanhã' : fmtShort(it.due)) : '';
    return `<div class="task ${it.done ? 'done' : ''}">
      <input type="checkbox" class="check" style="--c:${l.color}" data-task-done="${it.id}" ${it.done ? 'checked' : ''} aria-label="Concluir tarefa">
      <div class="task-text">${esc(it.text)}${it.notes ? `<div class="muted" style="font-size:12px">${esc(it.notes)}</div>` : ''}</div>
      <div class="task-meta">
        ${it.prio === 'alta' && !it.done ? '<span class="prio">ALTA</span>' : ''}
        ${dueLabel ? `<span class="${late ? 'late' : ''}">${late ? 'atrasada · ' : ''}${dueLabel}</span>` : ''}
        ${showList ? `<span class="tagpill" style="--c:${l.color}">${esc(l.name)}</span>` : ''}
      </div>
      <button class="icon-btn" data-task-edit="${it.id}" aria-label="Editar tarefa">${ICON.edit}</button>
    </div>`;
  }

  function taskModal(it) {
    modal({
      title: 'Editar tarefa',
      fields: [
        { name: 'text', label: 'Tarefa', value: it.text, required: true, full: true },
        { name: 'listId', label: 'Lista', type: 'select', value: it.listId, options: S.tasks.lists.map((l) => ({ value: l.id, label: l.name })) },
        { name: 'prio', label: 'Prioridade', type: 'select', value: it.prio || 'normal', options: [{ value: 'normal', label: 'Normal' }, { value: 'alta', label: 'Alta' }] },
        { name: 'due', label: 'Para quando', type: 'date', value: it.due || '' },
        { name: 'notes', label: 'Observação', value: it.notes || '' },
      ],
      onSave: (v) => { Object.assign(it, v); save(); rerender(); },
      onDelete: () => { S.tasks.items = S.tasks.items.filter((x) => x.id !== it.id); save(); rerender(); toast('Tarefa excluída.'); },
    });
  }

  function bindTaskActions(root) {
    on(root, 'change', '[data-task-done]', (e, el) => {
      const it = S.tasks.items.find((x) => x.id === el.dataset.taskDone);
      if (!it) return;
      it.done = el.checked;
      it.doneAt = el.checked ? today() : null;
      save(); rerender();
    });
    on(root, 'click', '[data-task-edit]', (e, el) => taskModal(S.tasks.items.find((x) => x.id === el.dataset.taskEdit)));
  }

  const goalProgress = (g) => g.steps && g.steps.length ? Math.round((g.steps.filter((s) => s.done).length / g.steps.length) * 100) : (g.done ? 100 : 0);

  function rerender() { PAGES[current].render(); }

  /* =========================================================
     HOJE
     ========================================================= */
  PAGES.hoje = (() => {
    const el = $('#pg-hoje');

    function render() {
      const t = today();
      const h = new Date().getHours();
      const saud = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
      const nome = S.profile.nome ? `, ${S.profile.nome}` : '';
      const daysLeft = diffDays(t, `${nextYear}-01-01`);
      const doy = diffDays(`${new Date().getFullYear()}-01-01`, t);
      const affirm = AFFIRMATIONS[doy % AFFIRMATIONS.length];
      const evs = eventsOn(t);
      const tasks = S.tasks.items
        .filter((i) => (!i.done && i.due && i.due <= t) || (i.done && i.doneAt === t) || (!i.done && i.prio === 'alta' && !i.due))
        .sort((a, b) => (a.done - b.done) || ((b.prio === 'alta') - (a.prio === 'alta')));
      const ws = weekStart(t);
      const week = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
      const goals = S.goals.filter((g) => goalProgress(g) < 100).slice(0, 4);

      el.innerHTML = `
        <div class="hero">
          <div>
            <div class="eyebrow">${esc(fmtLong(t))}</div>
            <h1>${saud.split(' ')[0]} <em>${saud.split(' ')[1]}</em>${esc(nome)} <span class="spark" aria-hidden="true">✦</span></h1>
          </div>
          <div class="countdown"><strong>${daysLeft}</strong><span class="muted">dias para ${nextYear}</span></div>
        </div>
        <div class="grid-2">
          <div class="stack">
            <div class="card">
              <div class="eyebrow">Meu foco de hoje</div>
              <input class="focus-input" id="focus-in" placeholder="A coisa mais importante de hoje é…" value="${esc(S.focus[t] || '')}" aria-label="Foco do dia">
              <div class="moods" role="group" aria-label="Como estou me sentindo">
                ${MOODS.map(([k, e, l]) => `<button class="mood ${S.mood[t] === k ? 'on' : ''}" data-mood="${k}" aria-pressed="${S.mood[t] === k}"><span aria-hidden="true">${e}</span>${l}</button>`).join('')}
              </div>
            </div>
            <div class="card">
              <div class="card-head"><h3>Compromissos de hoje</h3><button class="btn sm secondary" data-new-ev>+ Compromisso</button></div>
              ${evs.length ? evs.map((ev) => eventRow(ev, t, true)).join('') : '<div class="empty">Agenda livre hoje. Que tal reservar um tempinho para você?</div>'}
            </div>
            <div class="card">
              <div class="card-head"><h3>Tarefas para hoje</h3><span class="muted">${tasks.filter((x) => x.done).length}/${tasks.length} feitas</span></div>
              ${tasks.length ? tasks.map((it) => taskRow(it, true)).join('') : '<div class="empty">Nenhuma tarefa para hoje. Adicione abaixo ✨</div>'}
              <form class="quick-add" id="quick-task">
                <input class="input" name="text" placeholder="Adicionar tarefa para hoje…" aria-label="Nova tarefa para hoje" autocomplete="off">
                <button class="btn" type="submit">Adicionar</button>
              </form>
            </div>
          </div>
          <div class="stack">
            <div class="card affirm">
              <div class="eyebrow">Afirmação do dia</div>
              <p>${esc(affirm)}</p>
            </div>
            <div class="card">
              <div class="card-head"><h3>Hábitos da semana</h3><button class="btn sm ghost" data-new-habit>+ Hábito</button></div>
              ${S.habits.length ? `<table class="habits">
                <thead><tr><th>Hábito</th>${week.map((d) => `<th class="${d === t ? 'today' : ''}">${DOW[dow(d)].slice(0, 3)}</th>`).join('')}</tr></thead>
                <tbody>${S.habits.map((hb) => `<tr><td><button class="habit-name" data-habit-edit="${hb.id}">${esc(hb.name)}</button></td>${week.map((d) => `<td><button class="hcell ${hb.days[d] ? 'on' : ''}" data-habit="${hb.id}" data-date="${d}" ${d > t ? 'disabled' : ''} aria-label="${esc(hb.name)} — ${DOW_LONG[dow(d)]}" aria-pressed="${!!hb.days[d]}"></button></td>`).join('')}</tr>`).join('')}</tbody>
              </table>` : '<div class="empty">Crie hábitos que você quer cultivar.</div>'}
            </div>
            <div class="card">
              <div class="card-head"><h3>Metas em andamento</h3><button class="btn sm ghost" data-go="metas">Ver todas</button></div>
              ${goals.length ? goals.map((g) => { const a = AREAS[g.area] || AREAS.carreira; const p = goalProgress(g); return `<div class="mini-goal"><div class="row"><span>${esc(g.title)}</span><strong style="color:${a.color}">${p}%</strong></div><div class="progress" style="--c:${a.color}"><span style="width:${p}%"></span></div></div>`; }).join('') : '<div class="empty">Você ainda não criou metas. <br><button class="btn sm secondary" data-go="metas" style="margin-top:10px">Criar minha primeira meta</button></div>'}
            </div>
          </div>
        </div>`;
    }

    el.addEventListener('input', (e) => {
      if (e.target.id === 'focus-in') { S.focus[today()] = e.target.value; save(); }
    });
    on(el, 'click', '[data-mood]', (e, b) => {
      const t = today();
      S.mood[t] = S.mood[t] === b.dataset.mood ? null : b.dataset.mood;
      save(); render();
    });
    on(el, 'click', '[data-new-ev]', () => eventModal(null, today()));
    on(el, 'click', '[data-go]', (e, b) => go(b.dataset.go));
    on(el, 'submit', '#quick-task', (e, f) => {
      e.preventDefault();
      const text = f.elements.text.value.trim();
      if (!text) return;
      S.tasks.items.push({ id: uid(), listId: S.tasks.lists[0]?.id, text, done: false, prio: 'normal', due: today(), notes: '' });
      save(); render();
      setTimeout(() => $('#quick-task input', el)?.focus(), 0);
    });
    on(el, 'click', '[data-habit]', (e, b) => {
      const hb = S.habits.find((x) => x.id === b.dataset.habit);
      if (!hb) return;
      const d = b.dataset.date;
      if (hb.days[d]) delete hb.days[d]; else hb.days[d] = true;
      save(); render();
    });
    on(el, 'click', '[data-new-habit]', () => modal({
      title: 'Novo hábito', fields: [{ name: 'name', label: 'Hábito', required: true, placeholder: 'Ex: Meditar 5 minutos' }],
      onSave: (v) => { S.habits.push({ id: uid(), name: v.name.trim(), days: {} }); save(); render(); },
    }));
    on(el, 'click', '[data-habit-edit]', (e, b) => {
      const hb = S.habits.find((x) => x.id === b.dataset.habitEdit);
      modal({
        title: 'Editar hábito', fields: [{ name: 'name', label: 'Hábito', value: hb.name, required: true }],
        onSave: (v) => { hb.name = v.name.trim(); save(); render(); },
        onDelete: () => { S.habits = S.habits.filter((x) => x.id !== hb.id); save(); render(); },
      });
    });
    bindEventActions(el);
    bindTaskActions(el);
    return { render };
  })();

  /* =========================================================
     AGENDA
     ========================================================= */
  PAGES.agenda = (() => {
    const el = $('#pg-agenda');
    let sel = today();

    function render() {
      const t = today();
      const ws = weekStart(sel);
      const week = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
      const sd = parseISO(sel);
      const evs = eventsOn(sel);

      // mini month
      const first = new Date(sd.getFullYear(), sd.getMonth(), 1);
      const gridStart = weekStart(iso(first));
      const cells = Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
      const upcoming = [];
      for (let i = 1; i <= 14 && upcoming.length < 6; i++) {
        const d = addDays(t, i);
        eventsOn(d).forEach((ev) => { if (upcoming.length < 6) upcoming.push([d, ev]); });
      }

      el.innerHTML = `
        <div class="page-head">
          <div><h1>Agenda</h1><p>Seus compromissos do dia a dia, com repetição para a rotina.</p></div>
          <button class="btn" data-new-ev>+ Novo compromisso</button>
        </div>
        <div class="grid-2">
          <div>
            <div class="week-nav">
              <button class="icon-btn" data-week="-7" aria-label="Semana anterior">${ICON.left}</button>
              <h2>${MONTHS[sd.getMonth()]} ${sd.getFullYear()}</h2>
              <button class="btn sm ghost" data-goto="${t}">Hoje</button>
              <button class="icon-btn" data-week="7" aria-label="Próxima semana">${ICON.right}</button>
            </div>
            <div class="week">
              ${week.map((d) => { const es = eventsOn(d).slice(0, 4); return `<button class="day ${d === sel ? 'sel' : ''} ${d === t ? 'today' : ''}" data-goto="${d}" aria-label="${fmtLong(d)}"><div class="dw">${DOW[dow(d)]}</div><div class="dn">${parseISO(d).getDate()}</div><div class="dots">${es.map((ev) => `<i style="--c:${(CATS[ev.cat] || CATS.pessoal).color}"></i>`).join('')}</div></button>`; }).join('')}
            </div>
            <div class="card">
              <div class="card-head"><h3>${sel === t ? 'Hoje · ' : ''}${esc(fmtLong(sel).charAt(0).toUpperCase() + fmtLong(sel).slice(1))}</h3><button class="btn sm secondary" data-new-ev>+ Adicionar</button></div>
              ${evs.length ? evs.map((ev) => eventRow(ev, sel)).join('') : '<div class="empty"><div class="tag"></div>Nada marcado para este dia.</div>'}
            </div>
          </div>
          <div class="stack">
            <div class="card">
              <div class="card-head"><h3 style="text-transform:capitalize">${MONTHS[sd.getMonth()]}</h3>
                <div class="row" style="gap:2px"><button class="icon-btn" data-month="-1" aria-label="Mês anterior">${ICON.left}</button><button class="icon-btn" data-month="1" aria-label="Próximo mês">${ICON.right}</button></div>
              </div>
              <div class="month">
                ${['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map((d) => `<div class="mh">${d}</div>`).join('')}
                ${cells.map((d) => `<button class="mday ${parseISO(d).getMonth() !== sd.getMonth() ? 'out' : ''} ${d === t ? 'today' : ''} ${d === sel ? 'sel' : ''} ${eventsOn(d).length ? 'has' : ''}" data-goto="${d}" aria-label="${fmtLong(d)}">${parseISO(d).getDate()}</button>`).join('')}
              </div>
              <div class="legend">${Object.values(CATS).map((c) => `<span><i class="dot" style="--c:${c.color}"></i>${c.label}</span>`).join('')}</div>
            </div>
            <div class="card">
              <div class="card-head"><h3>Próximos dias</h3></div>
              ${upcoming.length ? upcoming.map(([d, ev]) => `<div class="task"><i class="dot" style="--c:${(CATS[ev.cat] || CATS.pessoal).color}"></i><div class="task-text">${esc(ev.title)}</div><div class="task-meta">${DOW[dow(d)]} ${fmtShort(d)}${ev.start ? ' · ' + esc(ev.start) : ''}</div></div>`).join('') : '<div class="empty">Nada nas próximas duas semanas.</div>'}
            </div>
          </div>
        </div>`;
    }

    on(el, 'click', '[data-goto]', (e, b) => { sel = b.dataset.goto; render(); });
    on(el, 'click', '[data-week]', (e, b) => { sel = addDays(sel, Number(b.dataset.week)); render(); });
    on(el, 'click', '[data-month]', (e, b) => {
      const d = parseISO(sel);
      const n = new Date(d.getFullYear(), d.getMonth() + Number(b.dataset.month), 1);
      sel = iso(n); render();
    });
    on(el, 'click', '[data-new-ev]', () => eventModal(null, sel));
    bindEventActions(el);
    return { render };
  })();

  /* =========================================================
     TAREFAS
     ========================================================= */
  PAGES.tarefas = (() => {
    const el = $('#pg-tarefas');

    function render() {
      const ui = S.ui;
      if (ui.taskList !== 'all' && !S.tasks.lists.find((l) => l.id === ui.taskList)) ui.taskList = 'all';
      const inList = S.tasks.items.filter((i) => ui.taskList === 'all' || i.listId === ui.taskList);
      let items = inList.filter((i) => ui.taskFilter === 'all' || (ui.taskFilter === 'pend' ? !i.done : i.done));
      items.sort((a, b) => (a.done - b.done) || ((b.prio === 'alta') - (a.prio === 'alta')) || ((a.due || '9999').localeCompare(b.due || '9999')));
      const pendCount = (id) => S.tasks.items.filter((i) => !i.done && (id === 'all' || i.listId === id)).length;
      const curList = S.tasks.lists.find((l) => l.id === ui.taskList);

      el.innerHTML = `
        <div class="page-head">
          <div><h1>Tarefas</h1><p>Organize tudo em listas — pessoal, trabalho, estudos, casa…</p></div>
        </div>
        <div class="row" style="justify-content:space-between;margin-bottom:14px;gap:10px">
          <div class="chips">
            <button class="chip ${ui.taskList === 'all' ? 'on' : ''}" data-list="all">Todas <span class="count">${pendCount('all')}</span></button>
            ${S.tasks.lists.map((l) => `<button class="chip ${ui.taskList === l.id ? 'on' : ''}" data-list="${l.id}"><i class="dot" style="--c:${l.color}"></i>${esc(l.name)} <span class="count">${pendCount(l.id)}</span></button>`).join('')}
            <button class="chip" data-new-list>+ Nova lista</button>
          </div>
          ${curList ? `<button class="btn sm ghost" data-edit-list>Editar lista</button>` : ''}
        </div>
        <div class="card">
          <form class="task-add" id="task-add">
            <input class="input" name="text" placeholder="O que você precisa fazer?" aria-label="Nova tarefa" autocomplete="off">
            <select class="input" name="prio" aria-label="Prioridade"><option value="normal">Prioridade normal</option><option value="alta">Prioridade alta</option></select>
            <input class="input" type="date" name="due" aria-label="Para quando">
            <button class="btn" type="submit">Adicionar</button>
          </form>
        </div>
        <div class="card">
          <div class="card-head">
            <div class="tabs" role="tablist">
              ${[['pend', 'Pendentes'], ['done', 'Concluídas'], ['all', 'Todas']].map(([k, l]) => `<button class="tab ${ui.taskFilter === k ? 'on' : ''}" data-filter="${k}" role="tab" aria-selected="${ui.taskFilter === k}">${l}</button>`).join('')}
            </div>
            ${inList.some((i) => i.done) ? '<button class="btn sm ghost" data-clear-done>Limpar concluídas</button>' : ''}
          </div>
          ${items.length ? items.map((it) => taskRow(it, ui.taskList === 'all')).join('') : `<div class="empty"><div class="tag"></div>${ui.taskFilter === 'done' ? 'Nenhuma tarefa concluída ainda.' : 'Tudo em dia por aqui! 🎀'}</div>`}
        </div>`;
    }

    on(el, 'click', '[data-list]', (e, b) => { S.ui.taskList = b.dataset.list; save(); render(); });
    on(el, 'click', '[data-filter]', (e, b) => { S.ui.taskFilter = b.dataset.filter; save(); render(); });
    on(el, 'submit', '#task-add', (e, f) => {
      e.preventDefault();
      const text = f.elements.text.value.trim();
      if (!text) { toast('Escreva a tarefa primeiro.'); return; }
      const listId = S.ui.taskList === 'all' ? S.tasks.lists[0]?.id : S.ui.taskList;
      S.tasks.items.push({ id: uid(), listId, text, done: false, prio: f.elements.prio.value, due: f.elements.due.value, notes: '' });
      save(); render();
      setTimeout(() => $('#task-add input[name=text]', el)?.focus(), 0);
    });
    on(el, 'click', '[data-clear-done]', () => {
      const ids = new Set(S.tasks.items.filter((i) => i.done && (S.ui.taskList === 'all' || i.listId === S.ui.taskList)).map((i) => i.id));
      confirmBox('Limpar concluídas?', `${ids.size} tarefa(s) concluída(s) serão removidas.`, () => {
        S.tasks.items = S.tasks.items.filter((i) => !ids.has(i.id)); save(); render();
      }, 'Limpar');
    });
    const listFields = (l) => [
      { name: 'name', label: 'Nome da lista', value: l ? l.name : '', required: true, placeholder: 'Ex: Faculdade' },
      { name: 'color', label: 'Cor', type: 'swatch', value: l ? l.color : LIST_COLORS[S.tasks.lists.length % LIST_COLORS.length], options: LIST_COLORS },
    ];
    on(el, 'click', '[data-new-list]', () => modal({
      title: 'Nova lista', fields: listFields(),
      onSave: (v) => { const l = { id: uid(), name: v.name.trim(), color: v.color || LIST_COLORS[0] }; S.tasks.lists.push(l); S.ui.taskList = l.id; save(); render(); },
    }));
    on(el, 'click', '[data-edit-list]', () => {
      const l = S.tasks.lists.find((x) => x.id === S.ui.taskList);
      modal({
        title: 'Editar lista', fields: listFields(l),
        onSave: (v) => { l.name = v.name.trim(); l.color = v.color || l.color; save(); render(); },
        onDelete: S.tasks.lists.length > 1 ? () => confirmBox('Excluir lista?', `A lista “${l.name}” e as tarefas dela serão removidas.`, () => {
          S.tasks.lists = S.tasks.lists.filter((x) => x.id !== l.id);
          S.tasks.items = S.tasks.items.filter((i) => i.listId !== l.id);
          S.ui.taskList = 'all'; save(); render();
        }) : null,
      });
    });
    bindTaskActions(el);
    return { render };
  })();
