  PAGES.metas = (() => {
    const el = $('#pg-metas');

    function render() {
      const f = S.ui.metaFilter;
      let goals = S.goals.slice();
      if (f === 'conquistadas') goals = goals.filter((g) => goalProgress(g) === 100);
      else if (f !== 'todas') goals = goals.filter((g) => g.area === f);
      goals.sort((a, b) => (goalProgress(a) === 100) - (goalProgress(b) === 100) || (a.deadline || '9999').localeCompare(b.deadline || '9999'));
      const won = S.goals.filter((g) => goalProgress(g) === 100).length;
      const t = today();

      el.innerHTML = `
        <div class="page-head">
          <div><h1>Metas</h1><p>${S.goals.length ? `${won} de ${S.goals.length} conquistadas. Divida cada meta em pequenos passos.` : 'Transforme sonhos em metas, e metas em pequenos passos.'}</p></div>
          <button class="btn" data-new-goal>+ Nova meta</button>
        </div>
        <div class="chips scroll" style="margin-bottom:16px">
          <button class="chip ${f === 'todas' ? 'on' : ''}" data-mf="todas">Todas</button>
          ${Object.entries(AREAS).map(([k, a]) => `<button class="chip ${f === k ? 'on' : ''}" data-mf="${k}"><i class="dot" style="--c:${a.color}"></i>${a.label}</button>`).join('')}
          <button class="chip ${f === 'conquistadas' ? 'on' : ''}" data-mf="conquistadas">✓ Conquistadas</button>
        </div>
        ${goals.length ? `<div class="goals">${goals.map((g) => {
          const a = AREAS[g.area] || AREAS.carreira;
          const p = goalProgress(g);
          const left = g.deadline ? diffDays(t, g.deadline) : null;
          return `<article class="card goal ${p === 100 ? 'is-won' : ''}" style="--c:${a.color}">
            <div class="goal-head">
              <div>
                <span class="tagpill" style="--c:${a.color}">${a.label}</span>
                <h3 style="margin-top:8px">${esc(g.title)}</h3>
              </div>
              <button class="icon-btn" data-edit-goal="${g.id}" aria-label="Editar meta">${ICON.edit}</button>
            </div>
            ${g.why ? `<p class="goal-why">“${esc(g.why)}”</p>` : ''}
            <div>
              <div class="goal-meta"><span>${p === 100 ? '<span class="won">✓ Conquistada!</span>' : `<strong>${p}%</strong> concluído`}</span><span>${g.deadline ? `até ${fmtDate(g.deadline)}${p < 100 ? ` · ${left >= 0 ? `faltam ${left} dias` : 'prazo passou'}` : ''}` : 'sem prazo'}</span></div>
              <div class="progress" style="margin-top:6px"><span style="width:${p}%"></span></div>
            </div>
            <ul class="steps">
              ${(g.steps || []).map((s) => `<li class="${s.done ? 'done' : ''}"><input type="checkbox" class="check" style="--c:${a.color}" data-step="${g.id}:${s.id}" ${s.done ? 'checked' : ''} aria-label="Concluir passo"><span>${esc(s.text)}</span><button class="icon-btn" data-del-step="${g.id}:${s.id}" aria-label="Remover passo">${ICON.x}</button></li>`).join('')}
            </ul>
            <form class="step-add" data-add-step="${g.id}">
              <input class="input" name="text" placeholder="+ Adicionar um passo" aria-label="Novo passo" autocomplete="off">
            </form>
            ${!(g.steps || []).length ? `<button class="btn sm ${g.done ? 'ghost' : 'secondary'}" data-toggle-goal="${g.id}">${g.done ? 'Desmarcar conquista' : '✓ Marcar como conquistada'}</button>` : ''}
          </article>`;
        }).join('')}</div>` : `<div class="card empty"><div class="tag"></div>${S.goals.length ? 'Nenhuma meta neste filtro.' : 'O que você quer conquistar? Crie sua primeira meta.'}<br><button class="btn" data-new-goal style="margin-top:14px">+ Nova meta</button></div>`}`;
    }

    function goalModal(g) {
      const isNew = !g;
      g = g || { title: '', area: S.ui.metaFilter in AREAS ? S.ui.metaFilter : 'saude', deadline: `${nextYear}-12-31`, why: '' };
      modal({
        title: isNew ? 'Nova meta' : 'Editar meta',
        fields: [
          { name: 'title', label: 'Minha meta', value: g.title, required: true, full: true, placeholder: 'Ex: Juntar R$ 5.000 para viajar' },
          { name: 'area', label: 'Área da vida', type: 'select', value: g.area, options: Object.entries(AREAS).map(([k, a]) => ({ value: k, label: a.label })) },
          { name: 'deadline', label: 'Prazo', type: 'date', value: g.deadline },
          { name: 'why', label: 'Por que isso é importante para mim?', type: 'textarea', value: g.why, full: true, rows: 2, placeholder: 'Seu motivo te mantém firme nos dias difíceis.' },
        ],
        onSave: (v) => {
          if (isNew) S.goals.push({ id: uid(), steps: [], done: false, createdAt: today(), ...v });
          else Object.assign(g, v);
          save(); render();
          if (isNew) toast('Meta criada! Agora adicione os primeiros passos.');
        },
        onDelete: isNew ? null : () => confirmBox('Excluir meta?', `“${g.title}” e seus passos serão removidos.`, () => {
          S.goals = S.goals.filter((x) => x.id !== g.id); save(); render();
        }),
      });
    }

    function findStep(key) {
      const [gid, sid] = key.split(':');
      const g = S.goals.find((x) => x.id === gid);
      return [g, g && g.steps.find((s) => s.id === sid)];
    }

    on(el, 'click', '[data-new-goal]', () => goalModal());
    on(el, 'click', '[data-edit-goal]', (e, b) => goalModal(S.goals.find((g) => g.id === b.dataset.editGoal)));
    on(el, 'click', '[data-mf]', (e, b) => { S.ui.metaFilter = b.dataset.mf; save(); render(); });
    on(el, 'change', '[data-step]', (e, c) => {
      const [g, s] = findStep(c.dataset.step);
      if (!s) return;
      const before = goalProgress(g);
      s.done = c.checked;
      save(); render();
      if (before < 100 && goalProgress(g) === 100) { confetti(); toast('Meta conquistada! Você é incrível 💖'); }
    });
    on(el, 'click', '[data-del-step]', (e, b) => {
      const [g, s] = findStep(b.dataset.delStep);
      if (!s) return;
      g.steps = g.steps.filter((x) => x !== s); save(); render();
    });
    on(el, 'submit', '[data-add-step]', (e, f) => {
      e.preventDefault();
      const text = f.elements.text.value.trim();
      if (!text) return;
      const gid = f.dataset.addStep;
      const g = S.goals.find((x) => x.id === gid);
      g.steps.push({ id: uid(), text, done: false });
      save(); render();
      setTimeout(() => $(`[data-add-step="${gid}"] input`, el)?.focus(), 0);
    });
    on(el, 'click', '[data-toggle-goal]', (e, b) => {
      const g = S.goals.find((x) => x.id === b.dataset.toggleGoal);
      g.done = !g.done; save(); render();
      if (g.done) { confetti(); toast('Meta conquistada! Você é incrível 💖'); }
    });
    return { render };
  })();

  /* =========================================================
     VISION BOARD
     ========================================================= */
  PAGES.vision = (() => {
    const el = $('#pg-vision');
    const BW = 1200, BH = 800;
    let scale = 1, selId = null, built = false, ro;

    function build() {
      el.innerHTML = `
        <div class="page-head">
          <div><h1>Vision board</h1><p>Monte o mural dos seus sonhos: fotos, frases e palavras. Arraste, gire e redimensione.</p></div>
          <button class="btn ghost" data-vb="title">Mudar título</button>
        </div>
        <div class="vb-toolbar">
          <button class="btn" data-vb="photo">+ Foto</button>
          <button class="btn secondary" data-vb="link">+ Foto por link</button>
          <button class="btn secondary" data-vb="quote">+ Frase</button>
          <button class="btn secondary" data-vb="note">+ Nota</button>
          <button class="btn secondary" data-vb="word">+ Palavra</button>
          <span class="sep"></span>
          <label class="muted" for="vb-bg" style="font-size:12.5px">Fundo</label>
          <select class="input" id="vb-bg" style="width:auto">
            <option value="creme">Creme</option><option value="rosa">Rosa</option><option value="menta">Menta</option><option value="cortica">Cortiça</option><option value="noite">Noite</option>
          </select>
        </div>
        <div class="vb-wrap" id="vb-wrap"><div class="vb-board" id="vb-board"></div></div>
        <p class="mm-hint">Toque num item para selecionar: ↻ gira, ✎ edita, ✕ remove, e a bolinha no canto redimensiona. Fotos ficam salvas neste aparelho.</p>`;
      const wrap = $('#vb-wrap', el);
      ro = new ResizeObserver(fit);
      ro.observe(wrap);
      bindBoard();
      built = true;
    }

    function fit() {
      const wrap = $('#vb-wrap', el);
      if (!wrap || !wrap.clientWidth) return;
      scale = wrap.clientWidth / BW;
      $('#vb-board', el).style.transform = `scale(${scale})`;
    }

    function itemHTML(it, i) {
      let inner = '';
      if (it.type === 'img') inner = `<img src="${esc(it.src)}" alt="" draggable="false">`;
      else inner = `<p>${esc(it.text)}</p>`;
      return `<div class="vb-item t-${it.type} ${it.id === selId ? 'sel' : ''}" data-id="${it.id}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;transform:rotate(${it.rot || 0}deg);z-index:${i + 1};--nc:${it.color || ''}">
        ${inner}
        <div class="vb-ctl"><button data-a="rot" aria-label="Girar">↻</button>${it.type !== 'img' ? '<button data-a="edit" aria-label="Editar">✎</button>' : ''}<button data-a="del" aria-label="Remover">✕</button></div>
        <div class="vb-rs" data-a="rs" aria-hidden="true"></div>
      </div>`;
    }

    function render() {
      if (!built) build();
      const board = $('#vb-board', el);
      const v = S.vision;
      board.className = 'vb-board bg-' + (v.bg || 'creme');
      $('#vb-bg', el).value = v.bg || 'creme';
      board.innerHTML = `<div class="vb-title">${esc(v.title || '')}</div>` +
        (v.items.length ? '' : '<div class="vb-empty">Seu mural está vazio. Comece adicionando uma foto ou frase ✨</div>') +
        v.items.map(itemHTML).join('');
      requestAnimationFrame(fit);
    }

    function addItem(it) {
      const n = S.vision.items.length;
      it.id = uid();
      it.x = it.x ?? clamp(120 + (n * 67) % 700, 20, BW - it.w - 20);
      it.y = it.y ?? clamp(130 + (n * 53) % 420, 90, BH - it.h - 20);
      it.rot = it.rot ?? [-4, 3, -2, 5, 0][n % 5];
      S.vision.items.push(it);
      selId = it.id;
      save(); render();
    }

    function textModal(type, it) {
      const isNew = !it;
      const cfg = {
        quote: { title: 'Frase inspiradora', label: 'Frase', ph: 'Ex: O universo conspira a meu favor.', area: true },
        note: { title: 'Nota', label: 'Texto', ph: 'Ex: Apartamento com varanda e plantas 🌿', area: true, colors: NOTE_COLORS },
        word: { title: 'Palavra', label: 'Palavra', ph: 'Ex: Liberdade', colors: WORD_COLORS },
      }[type];
      const fields = [{ name: 'text', label: cfg.label, type: cfg.area ? 'textarea' : 'text', value: it ? it.text : '', required: true, placeholder: cfg.ph, rows: 3 }];
      if (cfg.colors) fields.push({ name: 'color', label: 'Cor', type: 'swatch', value: it ? it.color : cfg.colors[0], options: cfg.colors });
      modal({
        title: (isNew ? 'Adicionar ' : 'Editar ') + cfg.title.toLowerCase(), fields,
        onSave: (v) => {
          if (isNew) {
            const size = { quote: [340, 200], note: [280, 190], word: [360, 130] }[type];
            addItem({ type, text: v.text.trim(), color: v.color || (cfg.colors && cfg.colors[0]), w: size[0], h: size[1] });
          } else {
            it.text = v.text.trim(); if (v.color) it.color = v.color; save(); render();
          }
        },
      });
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 900;
            const r = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve({ src: c.toDataURL('image/jpeg', 0.8), ratio: img.height / img.width });
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function addImage(src, ratio) {
      const w = 300;
      const h = clamp(Math.round((w - 20) * (ratio || 0.75)) + 20, 160, 420);
      addItem({ type: 'img', src, w, h });
    }

    $('#file-img').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      for (const f of files) {
        try { const r = await compressImage(f); addImage(r.src, r.ratio); } catch (err) { toast('Não consegui abrir essa imagem.'); }
      }
      e.target.value = '';
    });

    function bindBoard() {
      on(el, 'click', '[data-vb]', (e, b) => {
        const a = b.dataset.vb;
        if (a === 'photo') $('#file-img').click();
        else if (a === 'link') modal({
          title: 'Foto por link', message: 'Cole o endereço de uma imagem (Pinterest, Unsplash…). Ela precisa continuar disponível na internet.',
          fields: [{ name: 'url', label: 'Link da imagem', type: 'url', required: true, placeholder: 'https://…' }],
          onSave: (v) => {
            const url = v.url.trim();
            if (!/^https?:\/\//i.test(url)) { toast('O link precisa começar com http:// ou https://'); return false; }
            const img = new Image();
            img.onload = () => addImage(url, img.height / img.width);
            img.onerror = () => toast('Não consegui carregar essa imagem. Tente outro link.');
            img.src = url;
          },
        });
        else if (a === 'title') modal({
          title: 'Título do mural', fields: [{ name: 'title', label: 'Título', value: S.vision.title, placeholder: `Meu ${nextYear}` }],
          onSave: (v) => { S.vision.title = v.title.trim(); save(); render(); },
        });
        else textModal(a);
      });
      $('#vb-bg', el).addEventListener('change', (e) => { S.vision.bg = e.target.value; save(); render(); });

      const board = $('#vb-board', el);
      let drag = null;

      board.addEventListener('pointerdown', (e) => {
        const itemEl = e.target.closest('.vb-item');
        if (!itemEl) {
          if (selId) { selId = null; $$('.vb-item.sel', board).forEach((x) => x.classList.remove('sel')); }
          return;
        }
        const id = itemEl.dataset.id;
        const it = S.vision.items.find((x) => x.id === id);
        const act = e.target.closest('[data-a]')?.dataset.a;
        if (act && act !== 'rs') return; // handled on click
        // select & bring to front
        if (selId !== id) {
          selId = id;
          $$('.vb-item', board).forEach((x) => x.classList.toggle('sel', x.dataset.id === id));
        }
        const idx = S.vision.items.indexOf(it);
        if (idx !== S.vision.items.length - 1) {
          S.vision.items.splice(idx, 1); S.vision.items.push(it);
          itemEl.style.zIndex = S.vision.items.length + 1;
        }
        e.preventDefault();
        itemEl.setPointerCapture(e.pointerId);
        drag = { it, itemEl, mode: act === 'rs' ? 'rs' : 'move', sx: e.clientX, sy: e.clientY, ox: it.x, oy: it.y, ow: it.w, oh: it.h, moved: false };
        itemEl.classList.add('dragging');
      });
      board.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const dx = (e.clientX - drag.sx) / scale, dy = (e.clientY - drag.sy) / scale;
        if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
        const it = drag.it;
        if (drag.mode === 'move') {
          it.x = Math.round(clamp(drag.ox + dx, -it.w * 0.6, BW - it.w * 0.4));
          it.y = Math.round(clamp(drag.oy + dy, -it.h * 0.6, BH - it.h * 0.4));
          drag.itemEl.style.left = it.x + 'px'; drag.itemEl.style.top = it.y + 'px';
        } else {
          it.w = Math.round(clamp(drag.ow + dx, 90, BW)); it.h = Math.round(clamp(drag.oh + dy, 60, BH));
          drag.itemEl.style.width = it.w + 'px'; drag.itemEl.style.height = it.h + 'px';
        }
      });
      const end = () => {
        if (!drag) return;
        drag.itemEl.classList.remove('dragging');
        drag = null;
        save();
      };
      board.addEventListener('pointerup', end);
      board.addEventListener('pointercancel', end);

      on(board, 'click', '[data-a]', (e, b) => {
        const id = b.closest('.vb-item').dataset.id;
        const it = S.vision.items.find((x) => x.id === id);
        if (!it) return;
        if (b.dataset.a === 'rot') {
          const steps = [-6, -3, 0, 3, 6];
          const i = steps.indexOf(it.rot || 0);
          it.rot = steps[(i + 1) % steps.length];
          save(); render();
        } else if (b.dataset.a === 'edit') textModal(it.type, it);
        else if (b.dataset.a === 'del') {
          S.vision.items = S.vision.items.filter((x) => x.id !== id); selId = null; save(); render();
        }
      });
      board.addEventListener('dblclick', (e) => {
        const itemEl = e.target.closest('.vb-item');
        if (!itemEl || e.target.closest('[data-a]')) return;
        const it = S.vision.items.find((x) => x.id === itemEl.dataset.id);
        if (it && it.type !== 'img') textModal(it.type, it);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (current !== 'vision' || !selId || dlg.open) return;
      if ((e.key === 'Delete' || e.key === 'Backspace') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
        S.vision.items = S.vision.items.filter((x) => x.id !== selId); selId = null; save(); render();
      }
    });

    return { render };
  })();

  /* =========================================================
     MEU ANO
     ========================================================= */
  PAGES.ano = (() => {
    const el = $('#pg-ano');

    function yearData(y) {
      if (!S.anos[y]) S.anos[y] = { palavra: '', sentir: '', intencoes: {}, meses: Array(12).fill(''), desejos: [], carta: '' };
      return S.anos[y];
    }

    function wishesHTML(d, y) {
      const goal = y % 100;
      return `<ul class="wishes">${d.desejos.map((w, i) => `<li class="${w.done ? 'done' : ''}"><span class="n">${i + 1}.</span><input type="checkbox" class="check" data-wish="${w.id}" ${w.done ? 'checked' : ''} aria-label="Realizado"><span class="t">${esc(w.text)}</span><button class="icon-btn" data-del-wish="${w.id}" aria-label="Remover">${ICON.x}</button></li>`).join('')}</ul>
        ${d.desejos.length < goal ? `<form class="quick-add" id="wish-add"><input class="input" name="text" placeholder="Algo que quero viver em ${y}… (${d.desejos.length}/${goal})" aria-label="Novo desejo" autocomplete="off"><button class="btn" type="submit">Adicionar</button></form>` : `<p class="muted">Você completou sua lista de ${goal}! ✨</p>`}`;
    }

    function render() {
      const y = Number(S.anoSel) || nextYear;
      const d = yearData(y);
      const goal = y % 100;
      const now = new Date();
      const years = [now.getFullYear(), nextYear, nextYear + 1];
      if (!years.includes(y)) years.push(y);
      el.innerHTML = `
        <div class="page-head">
          <div><h1>Meu ${y}</h1><p>Planeje o ano com intenção: sua palavra, o que você quer sentir, viver e conquistar.</p></div>
          <div class="tabs" role="tablist">${years.sort().map((yy) => `<button class="tab ${yy === y ? 'on' : ''}" data-year="${yy}" role="tab" aria-selected="${yy === y}">${yy}</button>`).join('')}</div>
        </div>
        <div class="grid-2" style="margin-bottom:16px">
          <div class="card" style="text-align:center">
            <div class="eyebrow">Minha palavra do ano</div>
            <input class="year-word" data-bind="palavra" value="${esc(d.palavra)}" placeholder="Ex: Florescer" aria-label="Palavra do ano">
          </div>
          <div class="card">
            <div class="eyebrow" style="margin-bottom:6px">Como eu quero me sentir</div>
            <textarea class="input" data-bind="sentir" rows="3" placeholder="Leve, confiante, em paz com minhas escolhas…" aria-label="Como eu quero me sentir">${esc(d.sentir)}</textarea>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Intenções para cada área da vida</h3><span class="muted">Salva automaticamente</span></div>
          <div class="areas-grid">
            ${Object.entries(AREAS).map(([k, a]) => `<div class="area-box" style="--c:${a.color}"><label for="int-${k}"><i class="dot" style="--c:${a.color}"></i>${a.label}</label><textarea id="int-${k}" data-bind="intencoes.${k}" placeholder="O que eu quero aqui?">${esc(d.intencoes[k] || '')}</textarea></div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Foco de cada mês</h3></div>
          <div class="months-grid">
            ${MONTHS.map((m, i) => `<div class="month-box ${y === now.getFullYear() && i === now.getMonth() ? 'now' : ''}"><label for="mes-${i}">${m}</label><textarea id="mes-${i}" data-bind="meses.${i}" placeholder="Foco, datas especiais…">${esc(d.meses[i] || '')}</textarea></div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>${goal} coisas para viver em ${y}</h3><span class="muted" id="wish-count">${d.desejos.filter((w) => w.done).length} realizadas</span></div>
          <div id="wishes-box">${wishesHTML(d, y)}</div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Carta para a eu do fim de ${y}</h3></div>
          <textarea class="letter" data-bind="carta" placeholder="Querida eu, quando você ler isso…" aria-label="Carta para mim mesma">${esc(d.carta)}</textarea>
        </div>`;
    }

    function refreshWishes() {
      const y = Number(S.anoSel) || nextYear;
      const d = yearData(y);
      $('#wishes-box', el).innerHTML = wishesHTML(d, y);
      $('#wish-count', el).textContent = `${d.desejos.filter((w) => w.done).length} realizadas`;
    }

    el.addEventListener('input', (e) => {
      const path = e.target.dataset.bind;
      if (!path) return;
      const d = yearData(Number(S.anoSel) || nextYear);
      const [k, sub] = path.split('.');
      if (sub !== undefined) d[k][sub] = e.target.value; else d[k] = e.target.value;
      save();
    });
    on(el, 'click', '[data-year]', (e, b) => { S.anoSel = Number(b.dataset.year); save(); render(); });
    on(el, 'submit', '#wish-add', (e, f) => {
      e.preventDefault();
      const text = f.elements.text.value.trim();
      if (!text) return;
      yearData(Number(S.anoSel) || nextYear).desejos.push({ id: uid(), text, done: false });
      save(); refreshWishes();
      setTimeout(() => $('#wish-add input', el)?.focus(), 0);
    });
    on(el, 'change', '[data-wish]', (e, c) => {
      const d = yearData(Number(S.anoSel) || nextYear);
      const w = d.desejos.find((x) => x.id === c.dataset.wish);
      if (w) { w.done = c.checked; save(); refreshWishes(); if (w.done) toast('Mais um sonho vivido ✨'); }
    });
    on(el, 'click', '[data-del-wish]', (e, b) => {
      const d = yearData(Number(S.anoSel) || nextYear);
      d.desejos = d.desejos.filter((x) => x.id !== b.dataset.delWish); save(); refreshWishes();
    });
    return { render };
  })();

  /* =========================================================
     MAPA MENTAL
     ========================================================= */
  PAGES.mapa = (() => {
    const el = $('#pg-mapa');
    let built = false, selId = null, editingId = null;
    let canvas, layer, svg, nodesBox;

    const map = () => S.maps.find((m) => m.id === S.mapSel) || S.maps[0];
    const root = (m = map()) => m.nodes.find((n) => n.parent === null);
    const byId = (id) => map().nodes.find((n) => n.id === id);
    const children = (id) => map().nodes.filter((n) => n.parent === id);
    function subtree(id) {
      const out = [byId(id)];
      for (let i = 0; i < out.length; i++) out.push(...children(out[i].id));
      return out;
    }

    function build() {
      el.innerHTML = `
        <div class="page-head" style="margin-bottom:14px">
          <div><h1>Mapa mental</h1><p>Organize ideias, sonhos e projetos de um jeito visual.</p></div>
        </div>
        <div class="mm-toolbar">
          <select class="input" id="mm-select" aria-label="Escolher mapa"></select>
          <button class="btn sm secondary" data-mm="new-map">+ Novo mapa</button>
          <button class="btn sm ghost" data-mm="rename-map">Renomear</button>
          <button class="btn sm ghost" data-mm="del-map">Apagar mapa</button>
          <span class="sep"></span>
          <button class="btn sm" data-mm="child">+ Ramo</button>
          <button class="btn sm secondary" data-mm="sibling">+ Irmão</button>
          <button class="btn sm ghost" data-mm="edit">Editar</button>
          <div class="mm-colors" aria-label="Cor do ramo">${MM_COLORS.map((c) => `<button style="--c:${c}" data-mm-color="${c}" aria-label="Cor ${c}"></button>`).join('')}</div>
          <button class="btn sm danger-ghost" data-mm="del">Excluir</button>
        </div>
        <div class="mm-canvas" id="mm-canvas" tabindex="0" aria-label="Mapa mental. Use Tab para criar ramo, Enter para criar irmão, Delete para excluir.">
          <div class="mm-layer" id="mm-layer"><svg id="mm-svg" aria-hidden="true"></svg><div id="mm-nodes"></div></div>
          <div class="mm-zoom">
            <button class="icon-btn" data-zoom="1.2" aria-label="Aproximar">${ICON.plus}</button>
            <button class="icon-btn" data-zoom="0.833" aria-label="Afastar">${ICON.minus}</button>
            <button class="icon-btn" data-mm="center" aria-label="Centralizar">${ICON.target}</button>
          </div>
        </div>
        <p class="mm-hint">Clique numa ideia para selecionar · duplo clique para editar · arraste para mover (os ramos vão junto) · arraste o fundo para navegar · <kbd>Tab</kbd> novo ramo · <kbd>Enter</kbd> novo irmão · <kbd>Delete</kbd> excluir</p>`;
      canvas = $('#mm-canvas', el);
      layer = $('#mm-layer', el);
      svg = $('#mm-svg', el);
      nodesBox = $('#mm-nodes', el);
      bind();
      built = true;
    }

    function view() {
      const m = map();
      if (!m.view) centerView();
      return m.view;
    }
    function centerView() {
      const m = map();
      const r = root(m);
      const w = canvas.clientWidth || 800, h = canvas.clientHeight || 500;
      // fit all nodes
      const xs = m.nodes.map((n) => n.x), ys = m.nodes.map((n) => n.y);
      const minX = Math.min(...xs) - 140, maxX = Math.max(...xs) + 140, minY = Math.min(...ys) - 60, maxY = Math.max(...ys) + 60;
      const z = clamp(Math.min(w / (maxX - minX), h / (maxY - minY)), 0.25, 1.2);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      m.view = { x: w / 2 - cx * z, y: h / 2 - cy * z, z };
      if (!r) m.view = { x: w / 2, y: h / 2, z: 1 };
    }
    function applyView() {
      const v = view();
      layer.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.z})`;
    }
    function zoomAt(sx, sy, f) {
      const v = view();
      const nz = clamp(v.z * f, 0.25, 2.5);
      v.x = sx - (sx - v.x) * (nz / v.z);
      v.y = sy - (sy - v.y) * (nz / v.z);
      v.z = nz;
      applyView(); save();
    }

    function edgePath(p, c) {
      const dx = c.x - p.x;
      const mx = p.x + dx / 2;
      return `M${p.x},${p.y} C${mx},${p.y} ${mx},${c.y} ${c.x},${c.y}`;
    }
    function drawEdges() {
      const m = map();
      const r = root(m);
      svg.innerHTML = m.nodes.filter((n) => n.parent).map((n) => {
        const p = byId(n.parent);
        if (!p) return '';
        return `<path d="${edgePath(p, n)}" fill="none" stroke="${n.color}" stroke-width="${p === r ? 4 : 2.5}" stroke-linecap="round" opacity=".85"/>`;
      }).join('');
    }
    function drawNodes() {
      const m = map();
      nodesBox.innerHTML = m.nodes.map((n) => `<div class="mm-node ${n.parent === null ? 'root' : ''} ${n.id === selId ? 'sel' : ''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;--c:${n.color}">${esc(n.text)}</div>`).join('');
    }

    function render() {
      if (!built) build();
      if (!map()) { S.maps = seed().maps; S.mapSel = S.maps[0].id; }
      $('#mm-select', el).innerHTML = S.maps.map((m) => `<option value="${m.id}" ${m.id === S.mapSel ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
      if (selId && !byId(selId)) selId = null;
      drawEdges(); drawNodes();
      requestAnimationFrame(applyView);
    }

    function select(id) {
      selId = id;
      $$('.mm-node', nodesBox).forEach((n) => n.classList.toggle('sel', n.dataset.id === id));
    }

    function addNode(parentId) {
      const m = map();
      const p = byId(parentId);
      if (!p) return;
      const r = root(m);
      const kids = children(p.id);
      let x, y, color;
      if (p === r) {
        const ang = (kids.length * 2 * Math.PI) / 6 - Math.PI / 4;
        x = p.x + Math.cos(ang) * 270; y = p.y + Math.sin(ang) * 170;
        const used = kids.map((k) => k.color);
        color = MM_COLORS.find((c) => !used.includes(c) && c !== r.color) || MM_COLORS[kids.length % MM_COLORS.length];
      } else {
        const dir = p.x >= r.x ? 1 : -1;
        x = p.x + dir * 220;
        y = kids.length ? Math.max(...kids.map((k) => k.y)) + 64 : p.y;
        color = p.color;
      }
      const n = { id: uid(), parent: p.id, x: Math.round(x), y: Math.round(y), text: 'Nova ideia', color };
      m.nodes.push(n);
      save();
      selId = n.id;
      drawEdges(); drawNodes();
      startEdit(n.id, true);
    }

    function deleteNode(id) {
      const n = byId(id);
      if (!n) return;
      if (n.parent === null) { toast('A ideia central não pode ser excluída — edite o texto dela.'); return; }
      const ids = new Set(subtree(id).map((x) => x.id));
      const doIt = () => {
        const m = map();
        m.nodes = m.nodes.filter((x) => !ids.has(x.id));
        selId = n.parent; save(); render();
      };
      if (ids.size > 1) confirmBox('Excluir ideia?', `“${n.text}” e ${ids.size - 1} ideia(s) ligada(s) a ela serão removidas.`, doIt);
      else doIt();
    }

    function startEdit(id, selectAll) {
      const nEl = $(`.mm-node[data-id="${id}"]`, nodesBox);
      const n = byId(id);
      if (!nEl || !n) return;
      editingId = id;
      select(id);
      try { nEl.contentEditable = 'plaintext-only'; } catch (e) { nEl.contentEditable = 'true'; }
      if (nEl.contentEditable !== 'plaintext-only') nEl.contentEditable = 'true';
      nEl.setAttribute('contenteditable', nEl.contentEditable);
      nEl.focus();
      const range = document.createRange();
      range.selectNodeContents(nEl);
      if (!selectAll) range.collapse(false);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(range);
      const finish = (commit) => {
        if (editingId !== id) return;
        editingId = null;
        if (commit) n.text = nEl.innerText.replace(/\n+$/, '').trim() || 'Ideia';
        nEl.removeAttribute('contenteditable');
        save(); drawNodes(); drawEdges();
        canvas.focus({ preventScroll: true });
      };
      nEl.addEventListener('blur', () => finish(true), { once: true });
      nEl.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); nEl.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
    }

    function bind() {
      $('#mm-select', el).addEventListener('change', (e) => { S.mapSel = e.target.value; selId = null; save(); render(); });

      on(el, 'click', '[data-mm]', (e, b) => {
        const a = b.dataset.mm;
        const m = map();
        if (a === 'new-map') modal({
          title: 'Novo mapa mental', fields: [{ name: 'name', label: 'Tema central', required: true, placeholder: 'Ex: Meu negócio, Viagem dos sonhos…' }],
          onSave: (v) => {
            const name = v.name.trim();
            const nm = { id: uid(), name, nodes: [{ id: uid(), parent: null, x: 0, y: 0, text: name, color: '#7a2e3a' }], view: null };
            S.maps.push(nm); S.mapSel = nm.id; selId = nm.nodes[0].id; save(); render();
          },
        });
        else if (a === 'rename-map') modal({
          title: 'Renomear mapa', fields: [{ name: 'name', label: 'Nome', value: m.name, required: true }],
          onSave: (v) => { m.name = v.name.trim(); save(); render(); },
        });
        else if (a === 'del-map') {
          if (S.maps.length === 1) { toast('Você precisa ter pelo menos um mapa.'); return; }
          confirmBox('Excluir mapa?', `“${m.name}” e todas as ideias dele serão removidos.`, () => {
            S.maps = S.maps.filter((x) => x.id !== m.id); S.mapSel = S.maps[0].id; selId = null; save(); render();
          });
        }
        else if (a === 'child') addNode(selId || root().id);
        else if (a === 'sibling') {
          const n = selId && byId(selId);
          addNode(n && n.parent ? n.parent : root().id);
        }
        else if (a === 'edit') { if (selId) startEdit(selId, true); else toast('Selecione uma ideia primeiro.'); }
        else if (a === 'del') { if (selId) deleteNode(selId); else toast('Selecione uma ideia primeiro.'); }
        else if (a === 'center') { centerView(); applyView(); save(); }
      });
      on(el, 'click', '[data-mm-color]', (e, b) => {
        if (!selId) { toast('Selecione uma ideia para mudar a cor.'); return; }
        const r = root();
        const targets = selId === r.id ? [r] : subtree(selId);
        targets.forEach((n) => { n.color = b.dataset.mmColor; });
        save(); drawEdges(); drawNodes();
      });
      on(el, 'click', '[data-zoom]', (e, b) => zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, Number(b.dataset.zoom)));

      // pointer interactions
      const pts = new Map();
      let drag = null, pan = null, pinch = null;

      canvas.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.mm-zoom')) return;
        const nodeEl = e.target.closest('.mm-node');
        if (nodeEl && nodeEl.dataset.id === editingId) return;
        if (editingId) document.activeElement.blur();
        if (nodeEl) {
          const id = nodeEl.dataset.id;
          select(id);
          const nodes = subtree(id);
          drag = { id, sx: e.clientX, sy: e.clientY, orig: nodes.map((n) => [n, n.x, n.y]), moved: false };
          canvas.setPointerCapture(e.pointerId);
          canvas.focus({ preventScroll: true });
          e.preventDefault();
          return;
        }
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        canvas.setPointerCapture(e.pointerId);
        canvas.focus({ preventScroll: true });
        if (pts.size === 2) {
          const [a, b] = [...pts.values()];
          pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) };
          pan = null;
        } else {
          select(null);
          const v = view();
          pan = { sx: e.clientX, sy: e.clientY, ox: v.x, oy: v.y };
          canvas.classList.add('panning');
        }
      });
      canvas.addEventListener('pointermove', (e) => {
        if (drag) {
          const z = view().z;
          const dx = (e.clientX - drag.sx) / z, dy = (e.clientY - drag.sy) / z;
          if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
          drag.moved = true;
          drag.orig.forEach(([n, ox, oy]) => {
            n.x = Math.round(ox + dx); n.y = Math.round(oy + dy);
            const ne = $(`.mm-node[data-id="${n.id}"]`, nodesBox);
            if (ne) { ne.style.left = n.x + 'px'; ne.style.top = n.y + 'px'; }
          });
          drawEdges();
          return;
        }
        if (!pts.has(e.pointerId)) return;
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pinch && pts.size === 2) {
          const [a, b] = [...pts.values()];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          const rect = canvas.getBoundingClientRect();
          zoomAt((a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top, d / pinch.d);
          pinch.d = d;
        } else if (pan) {
          const v = view();
          v.x = pan.ox + (e.clientX - pan.sx); v.y = pan.oy + (e.clientY - pan.sy);
          applyView();
        }
      });
      let lastTap = { id: null, t: 0 };
      const up = (e) => {
        if (drag) {
          if (drag.moved) save();
          else {
            // double click / double tap on the same idea opens the editor
            const now = Date.now();
            if (lastTap.id === drag.id && now - lastTap.t < 400) { lastTap = { id: null, t: 0 }; const id = drag.id; drag = null; startEdit(id, true); return; }
            lastTap = { id: drag.id, t: now };
          }
          drag = null;
        }
        pts.delete(e.pointerId);
        if (pts.size < 2) pinch = null;
        if (pts.size === 0 && pan) { pan = null; canvas.classList.remove('panning'); save(); }
      };
      canvas.addEventListener('pointerup', up);
      canvas.addEventListener('pointercancel', up);

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
        } else {
          const v = view(); v.x -= e.deltaX; applyView();
        }
      }, { passive: false });

      canvas.addEventListener('keydown', (e) => {
        if (editingId || dlg.open) return;
        const r = root();
        if (e.key === 'Tab') { e.preventDefault(); addNode(selId || r.id); }
        else if (e.key === 'Enter') { e.preventDefault(); const n = selId && byId(selId); if (n && n.parent) addNode(n.parent); else if (n) startEdit(n.id, true); else addNode(r.id); }
        else if (e.key === 'Delete' || e.key === 'Backspace') { if (selId) { e.preventDefault(); deleteNode(selId); } }
        else if (e.key === 'F2') { if (selId) { e.preventDefault(); startEdit(selId, true); } }
        else if (e.key === 'Escape') select(null);
      });

      window.addEventListener('resize', () => { if (current === 'mapa') applyView(); });
    }

    return { render };
  })();

  $('#btn-theme').addEventListener('click', () => {
    const prevPal = getPref('lorace_planner_palette', 'lorace');
    const prevMode = getPref('lorace_planner_theme', 'auto');
    let saved = false;
    const card = ([k, p]) => {
      const l = p.light;
      return `<label class="pal"><input type="radio" name="palette" value="${k}" ${k === prevPal ? 'checked' : ''}><span class="pal-card"><span class="pal-prev" style="--p-bg:${l.bg};--p-sa:${l['side-a']};--p-sb:${l['side-b']};--p-br:linear-gradient(90deg, ${l.brand}, ${BRAND2[k][0]});--p-ac:${l.accent}"><span class="ps"></span><span class="pm"><i></i><i></i><i></i></span></span><span class="pal-name">${esc(p.name)}</span></span></label>`;
    };
    const modes = [['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']];
    modal({
      title: 'Escolha seu tema',
      message: 'Toque para ver como fica. O tema vale para o planner inteiro.',
      extraHTML: `<div class="field"><label>Cores</label><div class="pal-grid" role="radiogroup" aria-label="Cores">${Object.entries(PALETTES).map(card).join('')}</div></div>
        <div class="field"><label>Modo</label><div class="seg" role="radiogroup" aria-label="Modo">${modes.map(([v, l]) => `<label><input type="radio" name="mode" value="${v}" ${v === prevMode ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>`,
      onOpen: (form) => {
        form.addEventListener('change', () => {
          const v = Object.fromEntries(new FormData(form).entries());
          applyTheme(v.palette, v.mode);
        });
        dlg.addEventListener('close', () => { if (!saved) applyTheme(prevPal, prevMode); }, { once: true });
        setTimeout(() => form.querySelector('input[name=palette]:checked')?.focus(), 40);
      },
      onSave: (v) => {
        saved = true;
        try { localStorage.setItem('lorace_planner_palette', v.palette); localStorage.setItem('lorace_planner_theme', v.mode); } catch (e) {}
        applyTheme(v.palette, v.mode);
        toast(`Tema ${PALETTES[v.palette].name} aplicado ✨`);
      },
    });
  });

  $('#btn-settings').addEventListener('click', () => {
    modal({
      title: 'Ajustes',
      fields: [
        { name: 'nome', label: 'Como posso te chamar?', value: S.profile.nome, placeholder: 'Seu nome' },
      ],
      extraHTML: `<div class="settings-block">
        <p>Seus dados ficam salvos só neste navegador. Faça um backup de vez em quando — e use-o para levar tudo para outro aparelho.</p>
        <div class="row"><button type="button" class="btn sm secondary" id="bk-export">Baixar backup</button><button type="button" class="btn sm ghost" id="bk-import">Restaurar backup</button></div>
      </div>`,
      onOpen: (form) => {
        $('#bk-export', form).addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `lorace-planner-backup-${today()}.json`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          toast('Backup baixado.');
        });
        $('#bk-import', form).addEventListener('click', () => $('#file-backup').click());
      },
      onSave: (v) => {
        S.profile.nome = v.nome.trim();
        save(); rerender();
      },
    });
  });

  $('#file-backup').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); } catch (err) { toast('Esse arquivo não é um backup válido.'); return; }
      if (!data || !data.tasks || !data.maps) { toast('Esse arquivo não é um backup do Loracê Planner.'); return; }
      if (dlg.open) dlg.close();
      confirmBox('Restaurar backup?', 'Tudo o que está no planner agora será substituído pelo conteúdo do backup.', () => {
        S = migrate(data);
        if (!S.maps.find((m) => m.id === S.mapSel)) S.mapSel = S.maps[0].id;
        save(); location.reload();
      }, 'Restaurar');
    };
    reader.readAsText(f);
  });

  /* =========================================================
     Start
     ========================================================= */
  go((location.hash || '#hoje').slice(1));
  // re-render "Hoje" when the day changes or the tab becomes visible again
  let lastDay = today();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && today() !== lastDay) { lastDay = today(); rerender(); }
  });
})();
</script>
</body>
</html>
