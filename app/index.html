  PAGES.tarefas = (() => {
    const el = $('#pg-tarefas');
    function render() {
      const ui = S.ui;
      if (ui.taskList !== 'all' && !S.tasks.lists.find((l) => l.id === ui.taskList)) ui.taskList = 'all';
      const inList = S.tasks.items.filter((i) => ui.taskList === 'all' || i.listId === ui.taskList);
      const t0 = today();
      const doneNow = (i) => isDoneOn(i, t0);
      const items = inList.filter((i) => ui.taskFilter === 'all' || (ui.taskFilter === 'pend' ? !doneNow(i) : doneNow(i)));
      items.sort((a, b) => (doneNow(a) - doneNow(b)) || ((b.prio === 'alta') - (a.prio === 'alta')) || ((a.due || '9999').localeCompare(b.due || '9999')) || byTime(a, b));
      const pendCount = (id) => S.tasks.items.filter((i) => !doneNow(i) && (id === 'all' || i.listId === id)).length;
      const curList = S.tasks.lists.find((l) => l.id === ui.taskList);
      el.innerHTML = `
        <div class="page-head">
          <div><h1>tarefas</h1><div class="sub">listas · horários · <b>lembretes</b></div></div>
          ${curList ? '<button class="btn sm paper" data-edit-list>editar lista</button>' : ''}
        </div>
        <div class="chips scroll" style="margin-bottom:18px">
          <button class="chip ${ui.taskList === 'all' ? 'on' : ''}" data-list="all">Todas <span class="count">${pendCount('all')}</span></button>
          ${S.tasks.lists.map((l) => `<button class="chip ${ui.taskList === l.id ? 'on' : ''}" data-list="${l.id}"><i class="dot" style="--c:${l.color}"></i>${esc(l.name)} <span class="count">${pendCount(l.id)}</span></button>`).join('')}
          <button class="chip" data-new-list>+ nova lista</button>
        </div>
        <div class="card taped t-left">
          <form class="task-add" id="task-add">
            <div class="mic-wrap"><input class="input" name="text" placeholder="o que você precisa fazer?" aria-label="Nova tarefa" autocomplete="off"><button type="button" class="mic-btn" data-mic aria-label="Falar em vez de digitar" title="Falar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
            <select class="input" name="prio" aria-label="Prioridade"><option value="normal">Prioridade normal</option><option value="alta">Prioridade alta</option></select>
            <input class="input" type="date" name="due" aria-label="Para quando">
            <input class="input" type="time" name="time" aria-label="Horário (opcional)" title="Horário (opcional)">
            <button class="btn" type="submit">Adicionar</button>
          </form>
          <p class="muted" style="margin:10px 0 0;font-size:12.5px">🕘 Com horário, ela aparece na agenda e te avisa na hora. Para repetir ou mudar o lembrete, toque no ✎ da tarefa.</p>
        </div>
        <div class="card">
          ${CLIP}
          <div class="card-head">
            <div class="tabs" role="tablist">
              ${[['pend', 'Pendentes'], ['done', 'Concluídas'], ['all', 'Todas']].map(([k, l]) => `<button class="tab ${ui.taskFilter === k ? 'on' : ''}" data-filter="${k}" role="tab" aria-selected="${ui.taskFilter === k}">${l}</button>`).join('')}
            </div>
            ${inList.some((i) => i.done) ? '<button class="btn sm ghost" data-clear-done>limpar concluídas</button>' : ''}
          </div>
          ${items.length ? items.map((it) => taskRow(it, ui.taskList === 'all')).join('') : `<div class="empty"><span class="hand">${ui.taskFilter === 'done' ? 'nada concluído ainda' : 'tudo em dia por aqui!'} ♡</span></div>`}
        </div>`;
    }
    on(el, 'click', '[data-list]', (e, b) => { S.ui.taskList = b.dataset.list; save(); render(); });
    on(el, 'click', '[data-filter]', (e, b) => { S.ui.taskFilter = b.dataset.filter; save(); render(); });
    on(el, 'submit', '#task-add', (e, f) => {
      e.preventDefault();
      const raw = f.elements.text.value.trim();
      if (!raw) { toast('Escreva ou fale a tarefa primeiro.'); return; }
      const ps = parsePT(raw);
      const listId = S.ui.taskList === 'all' ? S.tasks.lists[0]?.id : S.ui.taskList;
      const time = f.elements.time.value || ps.time;
      const due = f.elements.due.value || ps.due || (time ? today() : '');
      S.tasks.items.push({ id: uid(), listId, text: ps.text || raw, done: false, doneDates: {}, prio: f.elements.prio.value, due, time, end: '', repeat: 'none', remindMin: time ? '0' : '', notes: '' });
      save(); render();
      if (due || time) toast(`Marcado: ${whenLabel(due, time)}${time ? ', com lembrete 🔔' : ''}`);
      setTimeout(() => $('#task-add input[name=text]', el)?.focus(), 0);
    });
    on(el, 'click', '[data-clear-done]', () => {
      const ids = new Set(S.tasks.items.filter((i) => !isRep(i) && i.done && (S.ui.taskList === 'all' || i.listId === S.ui.taskList)).map((i) => i.id));
      confirmBox('limpar concluídas?', `${ids.size} tarefa(s) concluída(s) serão removidas.`, () => { S.tasks.items = S.tasks.items.filter((i) => !ids.has(i.id)); save(); render(); }, 'Limpar');
    });
    const listFields = (l) => [
      { name: 'name', label: 'Nome da lista', value: l ? l.name : '', required: true, placeholder: 'Ex: Faculdade' },
      { name: 'color', label: 'Cor', type: 'swatch', value: l ? l.color : LIST_COLORS[S.tasks.lists.length % LIST_COLORS.length], options: LIST_COLORS },
    ];
    on(el, 'click', '[data-new-list]', () => modal({
      title: 'nova lista', fields: listFields(),
      onSave: (v) => { const l = { id: uid(), name: v.name.trim(), color: v.color || LIST_COLORS[0] }; S.tasks.lists.push(l); S.ui.taskList = l.id; save(); render(); },
    }));
    on(el, 'click', '[data-edit-list]', () => {
      const l = S.tasks.lists.find((x) => x.id === S.ui.taskList);
      modal({
        title: 'editar lista', fields: listFields(l),
        onSave: (v) => { l.name = v.name.trim(); l.color = v.color || l.color; save(); render(); },
        onDelete: S.tasks.lists.length > 1 ? () => confirmBox('excluir lista?', `A lista “${l.name}” e as tarefas dela serão removidas.`, () => {
          S.tasks.lists = S.tasks.lists.filter((x) => x.id !== l.id);
          S.tasks.items = S.tasks.items.filter((i) => i.listId !== l.id);
          S.ui.taskList = 'all'; save(); render();
        }) : null,
      });
    });
    bindTaskActions(el);
    return { render };
  })();

  PAGES.habitos = (() => {
    const el = $('#pg-habitos');
    let month = today().slice(0, 7);
    function render() {
      const t = today();
      const [y, m] = month.split('-').map(Number);
      const nDays = new Date(y, m, 0).getDate();
      const days = Array.from({ length: nDays }, (_, i) => `${month}-${pad(i + 1)}`);
      el.innerHTML = `
        <div class="page-head">
          <div><h1>hábitos</h1><div class="sub">pequenos rituais · <b>todos os dias</b></div></div>
          <button class="btn" data-new-habit>+ novo hábito</button>
        </div>
        ${S.habits.length ? `<div class="hb-week">${S.habits.map((h, i) => {
          const wc = weekCount(h);
          return `<div class="card hb-card ${i % 2 ? 'tilt-r' : 'tilt-l'}" style="--c:${h.color}">
            <div class="top"><span class="em" aria-hidden="true">${esc(h.emoji)}</span><div style="min-width:0"><div class="nm">${esc(h.name)}</div><div class="goal-t">${h.goal === 7 ? 'todos os dias' : h.goal + 'x por semana'}</div></div>

            <div class="progress" style="--c:${h.color}"><span style="width:${Math.min(100, Math.round((wc / h.goal) * 100))}%"></span></div>
            <div class="stats"><span>esta semana ${wc}/${h.goal}</span><span>🔥 ${habitStreak(h)} ${habitStreak(h) === 1 ? 'dia' : 'dias'}</span></div>
          </div>`;
        }).join('')}</div>
        <div class="card taped">
          <div class="card-head">
            <div class="row" style="gap:6px"><button class="icon-btn" data-hm="-1" aria-label="Mês anterior">${ICON.left}</button><h3>${MONTHS[m - 1]} ${y}</h3><button class="icon-btn" data-hm="1" aria-label="Próximo mês">${ICON.right}</button></div>
            <span class="muted">toque nos círculos para marcar</span>
          </div>
          <div class="hb-scroll">
            <table class="hb-month">
              <thead><tr><th></th>${days.map((d) => `<th class="${d === t ? 'today' : ''}">${DOW[dow(d)].charAt(0)}<br>${Number(d.slice(8))}</th>`).join('')}<th>total</th></tr></thead>
              <tbody>${S.habits.map((h) => `<tr style="--c:${h.color}"><td>${esc(h.emoji)} ${esc(h.name)}</td>${days.map((d) => `<td><button class="hcell ${h.days[d] ? 'on' : ''} ${d === t ? 'today' : ''}" data-habit="${h.id}" data-date="${d}" ${d > t ? 'disabled' : ''} aria-label="${esc(h.name)}, dia ${Number(d.slice(8))}" aria-pressed="${!!h.days[d]}"></button></td>`).join('')}<td class="hcount">${days.filter((d) => h.days[d]).length}</td></tr>`).join('')}</tbody>
            </table>
          </div>
        </div>` : '<div class="card empty"><span class="hand">que rituais você quer cultivar?</span>crie seu primeiro hábito<br><button class="btn" data-new-habit style="margin-top:12px">+ novo hábito</button></div>'}`;
    }
    on(el, 'click', '[data-hm]', (e, b) => { const [y, m] = month.split('-').map(Number); const d = new Date(y, m - 1 + Number(b.dataset.hm), 1); month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); });
    on(el, 'click', '[data-move]', (e, b) => {
      const [id, dir] = b.dataset.move.split(':');
      const i = S.habits.findIndex((h) => h.id === id);
      const j = i + Number(dir);
      if (i < 0 || j < 0 || j >= S.habits.length) return;
      [S.habits[i], S.habits[j]] = [S.habits[j], S.habits[i]];
      save(); render();
    });
    bindHabitActions(el);
    return { render };
  })();

      let goals = S.goals.slice();
      if (f === 'conquistadas') goals = goals.filter((g) => goalProgress(g) === 100);
      else if (f !== 'todas') goals = goals.filter((g) => g.area === f);
      goals.sort((a, b) => (goalProgress(a) === 100) - (goalProgress(b) === 100) || (a.deadline || '9999').localeCompare(b.deadline || '9999'));
      const won = S.goals.filter((g) => goalProgress(g) === 100).length;
      const t = today();
      el.innerHTML = `
        <div class="page-head">
          <div><h1>metas</h1><div class="sub">${S.goals.length ? `<b>${won} de ${S.goals.length}</b> conquistadas` : 'sonhos · metas · pequenos passos'}</div></div>
          <button class="btn" data-new-goal>+ nova meta</button>
        </div>
        <div class="chips scroll" style="margin-bottom:22px">
          <button class="chip ${f === 'todas' ? 'on' : ''}" data-mf="todas">Todas</button>

        ${goals.length ? `<div class="goals">${goals.map((g) => {

          return `<article class="card goal taped" style="--c:${a.color}">

              <div><span class="tagpill" style="--c:${a.color}">${a.label}</span><h3>${esc(g.title)}</h3></div>
              <div class="row" style="gap:0;flex-wrap:nowrap"><button class="icon-btn" data-goal-map="${g.id}" aria-label="Abrir mapa da meta" title="Mapa da meta">🧠</button><button class="icon-btn" data-edit-goal="${g.id}" aria-label="Editar meta">${ICON.edit}</button></div>
            </div>
            ${g.why ? `<p class="goal-why">“${esc(g.why)}”</p>` : ''}
            <div>
              ${isNumGoal(g) ? `<div class="goal-num"><b>${fmtGoal(g, g.current)}</b> de ${fmtGoal(g, g.target)}${p < 100 ? `<span class="muted"> · faltam ${fmtGoal(g, Math.max(0, g.target - (Number(g.current) || 0)))}</span>` : ''}</div>` : ''}

              <button class="btn sm ghost" type="button" data-goal-set="${g.id}">corrigir total</button>

            ${(g.log || []).length ? `<div class="goal-log">${g.log.slice(-3).reverse().map((l) => `<span>${fmtShort(l.d)}: ${l.v >= 0 ? '+' : ''}${fmtGoal(g, l.v)}</span>`).join('')}</div>` : ''}` : ''}
            <ul class="steps">
              ${(g.steps || []).map((s) => `<li class="${s.done ? 'done' : ''}"><input type="checkbox" class="check" style="--c:${a.color}" data-step="${g.id}:${s.id}" ${s.done ? 'checked' : ''} aria-label="Concluir passo"><span>${esc(s.text)}</span><button class="icon-btn" data-del-step="${g.id}:${s.id}" aria-label="Remover passo">${ICON.x}</button></li>`).join('')}

          </article>`;
        }).join('')}</div>` : `<div class="card empty"><span class="hand">${S.goals.length ? 'nenhuma meta neste filtro' : 'o que você quer conquistar?'}</span><button class="btn" data-new-goal style="margin-top:12px">+ nova meta</button></div>`}`;

          { name: 'why', label: 'Por que isso é importante para mim?', type: 'textarea', value: g.why, full: true, rows: 2, placeholder: 'Seu motivo te mantém firme nos dias difíceis.' },
          { name: 'unit', label: 'Acompanhar por número?', type: 'select', value: g.unit || (isNumGoal(g) ? '' : 'none'), options: [{ value: 'none', label: 'Não, por passos' }, { value: 'R$', label: 'Sim, em dinheiro (R$)' }, { value: 'kg', label: 'Sim, em quilos (kg)' }, { value: 'vezes', label: 'Sim, em vezes' }, { value: '', label: 'Sim, outro número' }] },
          { name: 'target', label: 'Valor total da meta', type: 'number', value: isNumGoal(g) ? g.target : '', placeholder: 'Ex: 30000' },
          { name: 'current', label: 'Quanto já fez até agora', type: 'number', value: isNumGoal(g) ? (g.current || 0) : '', placeholder: 'Ex: 10000' },
        ],
        onOpen: (form) => {
          const sync = () => { const off = form.elements.unit.value === 'none'; ['target', 'current'].forEach((k) => { form.elements[k].closest('.field').style.display = off ? 'none' : ''; }); };
          form.elements.unit.addEventListener('change', sync); sync();
          if (isNew) form.elements.title.addEventListener('blur', () => { // "Juntar 30 K…" já sugere o número
            const m = form.elements.title.value.match(/(\d+(?:[.,]\d+)?)\s*(k|mil)?\b/i);
            if (m && form.elements.unit.value === 'none' && !form.elements.target.value) {
              const n = parseFloat(m[1].replace(',', '.')) * (m[2] ? 1000 : 1);
              if (/r\$|reais|juntar|guardar|economizar|\bk\b|mil/i.test(form.elements.title.value)) { form.elements.unit.value = 'R$'; form.elements.target.value = n; }
              else if (/kg|quilo|emagrecer|perder/i.test(form.elements.title.value)) { form.elements.unit.value = 'kg'; form.elements.target.value = n; }
              sync();
            }
          });
        },
        onSave: (v) => {
          const num = v.unit !== 'none' && Number(v.target) > 0;
          const data = { title: v.title, area: v.area, deadline: v.deadline, why: v.why, unit: num ? v.unit : '', target: num ? Number(v.target) : 0, current: num ? Number(v.current) || 0 : 0 };
          if (!num && v.unit !== 'none' && !(Number(v.target) > 0)) { toast('Coloque o valor total da meta.'); return false; }
          if (isNew) S.goals.push({ id: uid(), steps: [], done: false, createdAt: today(), ...data }); else Object.assign(g, data);
          save(); render();
          if (isNew) toast('Meta criada! Agora adicione os primeiros passos.');
        },
        onDelete: isNew ? null : () => confirmBox('excluir meta?', `“${g.title}” e seus passos serão removidos.`, () => { S.goals = S.goals.filter((x) => x.id !== g.id); save(); render(); }),
      });
    }
    function findStep(key) { const [gid, sid] = key.split(':'); const g = S.goals.find((x) => x.id === gid); return [g, g && g.steps.find((s) => s.id === sid)]; }
    on(el, 'click', '[data-new-goal]', () => goalModal());
    on(el, 'click', '[data-edit-goal]', (e, b) => goalModal(S.goals.find((g) => g.id === b.dataset.editGoal)));
    on(el, 'click', '[data-goal-map]', (e, b) => openLinkedMap('goal', b.dataset.goalMap));
    on(el, 'click', '[data-mf]', (e, b) => { S.ui.metaFilter = b.dataset.mf; save(); render(); });
    on(el, 'change', '[data-step]', (e, c) => {
      const [g, s] = findStep(c.dataset.step);
      if (!s) return;
      const before = goalProgress(g);
      s.done = c.checked; save(); render();
      if (before < 100 && goalProgress(g) === 100) { confetti(); toast('Meta conquistada! Você é incrível 💖'); }
    });
    on(el, 'click', '[data-del-step]', (e, b) => { const [g, s] = findStep(b.dataset.delStep); if (!s) return; g.steps = g.steps.filter((x) => x !== s); save(); render(); });
    on(el, 'submit', '[data-add-step]', (e, f) => {
      e.preventDefault();
      const text = f.elements.text.value.trim();
      if (!text) return;
      const gid = f.dataset.addStep;
      S.goals.find((x) => x.id === gid).steps.push({ id: uid(), text, done: false });
      save(); render();
      setTimeout(() => $(`[data-add-step="${gid}"] input`, el)?.focus(), 0);
    });
    const addToGoal = (g, n, set) => {
      const before = goalProgress(g);
      const prev = Number(g.current) || 0;
      g.current = set ? n : prev + n;
      (g.log = g.log || []).push({ d: today(), v: g.current - prev });
      g.log = g.log.slice(-30);
      save(); render();
      if (before < 100 && goalProgress(g) === 100) { confetti(); toast('Meta conquistada! Você é incrível 💖'); }
      else toast(`Anotado: ${fmtGoal(g, g.current)} de ${fmtGoal(g, g.target)} ✨`);
    };
    on(el, 'submit', '[data-goal-add]', (e, f) => {
      e.preventDefault();
      const g = S.goals.find((x) => x.id === f.dataset.goalAdd), n = parseFloat(String(f.elements.v.value).replace(',', '.'));
      if (!g || !Number.isFinite(n) || !n) { toast('Digite quanto você avançou.'); return; }
      addToGoal(g, n, false);
    });
    on(el, 'click', '[data-goal-set]', (e, b) => {
      const g = S.goals.find((x) => x.id === b.dataset.goalSet); if (!g) return;
      modal({ title: 'corrigir o total', message: g.title, fields: [{ name: 'v', label: 'Quanto já fez no total', type: 'number', value: g.current || 0, full: true }],
        onSave: (v) => { const n = parseFloat(String(v.v).replace(',', '.')); if (!Number.isFinite(n)) return false; addToGoal(g, n, true); } });
    });
    on(el, 'click', '[data-toggle-goal]', (e, b) => {
      const g = S.goals.find((x) => x.id === b.dataset.toggleGoal);
      g.done = !g.done; save(); render();
      if (g.done) { confetti(); toast('Meta conquistada! Você é incrível 💖'); }
    });
    return { render };
  })();

  /* =========================================================
     MURAL (vision board)

  PAGES.vision = (() => {
    const el = $('#pg-vision');

    let scale = 1, selId = null, built = false;

    function build() {
      el.innerHTML = `
        <div class="page-head">
          <div><h1>mural dos sonhos</h1><div class="sub">arraste · gire · redimensione · <b>solte fotos aqui</b></div></div>
          <button class="btn sm paper" data-vb="title">mudar título</button>
        </div>
        <div class="vb-toolbar">
          <button class="btn" data-vb="photo">+ foto</button>
          ${inClaude ? '' : '<button class="btn secondary" data-vb="link">+ foto por link</button>'}
          <button class="btn secondary" data-vb="quote">+ frase</button>
          <button class="btn secondary" data-vb="note">+ bilhete</button>
          <button class="btn secondary" data-vb="word">+ palavra</button>
          <button class="btn secondary" data-vb="sticker">+ adesivo</button>
          <span class="sep"></span>
          <select class="input" id="vb-bg" aria-label="Fundo do mural">

          </select>
        </div>
        <div class="vb-wrap" id="vb-wrap"><div class="vb-board" id="vb-board"></div></div>
        <p class="page-hint">Arraste qualquer item com o dedo ou o mouse. Toque num item para ver os botões: ↻ gira, ✎ edita, ✕ remove; a bolinha rosa no canto muda o tamanho.<br>No computador, você também pode arrastar fotos de uma pasta direto para o mural ou colar uma imagem (<kbd>Ctrl</kbd>+<kbd>V</kbd>).</p>`;
      new ResizeObserver(fit).observe($('#vb-wrap', el));
      bindBoard();
      built = true;
    }
    function fit() {
      const wrap = $('#vb-wrap', el);
      if (!wrap || !wrap.clientWidth) return;

      const board = $('#vb-board', el);

    }
    function itemHTML(it, i) {

      const isText = it.type === 'quote' || it.type === 'note' || it.type === 'word';
      const fs = it.type === 'sticker' ? `font-size:${Math.round(Math.min(it.w, it.h) * 0.82)}px;` : isText ? `--ts:${it.fs || 1};` : '';
      return `<div class="vb-item t-${it.type} ${it.id === selId ? 'sel' : ''}" data-id="${it.id}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;transform:rotate(${it.rot || 0}deg);z-index:${i + 1};--nc:${it.color || ''};--pin:${pinFor(it.id)};${fs}">
        ${inner}
        ${isText ? '<div class="vb-fs"><button data-a="fs-" aria-label="Diminuir a letra">A−</button><span>letra</span><button data-a="fs+" aria-label="Aumentar a letra">A+</button></div>' : ''}<div class="vb-ctl"><button data-a="rot" aria-label="Girar">↻</button><button data-a="edit" aria-label="Editar">${it.type === 'img' ? '⧉' : '✎'}</button><button data-a="del" aria-label="Remover">✕</button></div>
        <div class="vb-rs" data-a="rs" aria-hidden="true"></div>
      </div>`;
    }
    function render() {
      if (!built) build();
      const board = $('#vb-board', el);
      const v = S.vision;
      board.className = 'vb-board bg-' + (v.bg || 'cortica');
      $('#vb-bg', el).value = v.bg || 'cortica';
      board.innerHTML = `<div class="vb-title">${esc(v.title || '')}</div>` +
        (v.items.length ? '' : '<div class="vb-empty">seu mural está vazio ♡ adicione fotos, frases e adesivos</div>') +
        v.items.map(itemHTML).join('');
      requestAnimationFrame(fit);
    }
    function addItem(it) {
      const n = S.vision.items.length;
      it.id = uid();
      it.x = Math.round(it.x ?? clamp(120 + (n * 67) % 700, 20, BW - it.w - 20));
      it.y = Math.round(it.y ?? clamp(130 + (n * 53) % 420, 90, BH - it.h - 20));
      it.rot = it.rot ?? [-4, 3, -2, 5, 0][n % 5];
      S.vision.items.push(it);
      selId = it.id;
      save(); render();
    }
    function textModal(type, it) {
      const isNew = !it;
      const cfg = {
        quote: { title: 'frase', label: 'Frase', ph: 'Ex: Ela acreditou que podia, então ela fez.', area: true },
        note: { title: 'bilhete', label: 'Texto', ph: 'Ex: apartamento com varanda e plantas', area: true, colors: NOTE_COLORS },
        word: { title: 'palavra', label: 'Palavra', ph: 'Ex: Liberdade', colors: WORD_COLORS },
      }[type];
      const fields = [{ name: 'text', label: cfg.label, type: cfg.area ? 'textarea' : 'text', value: it ? it.text : '', required: true, placeholder: cfg.ph, rows: 3 }];
      const curFs = it ? (it.fs || 1) : 1;
      const sizes = [['0.7', 'Pequena'], ['1', 'Média'], ['1.4', 'Grande'], ['1.9', 'Enorme']];
      if (!sizes.some(([v]) => Number(v) === curFs)) sizes.unshift([String(curFs), 'Como está agora']);
      fields.push({ name: 'fs', label: 'Tamanho da letra', type: 'select', value: String(curFs), options: sizes.map(([value, label]) => ({ value, label })) });
      if (cfg.colors) fields.push({ name: 'color', label: 'Cor', type: 'swatch', value: it ? it.color : cfg.colors[0], options: cfg.colors });
      modal({
        title: (isNew ? 'adicionar ' : 'editar ') + cfg.title, fields,
        onSave: (v) => {
          if (isNew) {
            const size = { quote: [360, 240], note: [320, 210], word: [380, 130] }[type];
            addItem({ type, text: v.text.trim(), color: v.color || (cfg.colors && cfg.colors[0]), w: Math.round(size[0] * Math.min(1.6, Math.max(0.8, Number(v.fs) || 1))), h: Math.round(size[1] * Math.min(1.6, Math.max(0.8, Number(v.fs) || 1))), fs: Number(v.fs) || 1 });

    function stickerPicker(onPick, title) {

        title,

        cancelLabel: 'Fechar',
        onOpen: (form) => on(form, 'click', '[data-st]', (e, b) => { dlg.close(); onPick(b.dataset.st); }),
      });
    }
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 900;
            const r = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            const ratio = img.height / img.width;
            const dataUrl = () => resolve({ src: c.toDataURL('image/jpeg', 0.8), ratio });
            if (!Cloud.assets || !c.toBlob) return dataUrl();
            c.toBlob((blob) => {
              if (!blob) return dataUrl();
              Cloud.assets.upload(blob).then((res) => resolve({ src: res.url, ratio })).catch(dataUrl);
            }, 'image/jpeg', 0.85);
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    function addImage(src, ratio, at) {
      const w = 300;
      const h = clamp(Math.round((w - 24) * (ratio || 0.75)) + 52, 180, 440);
      const pos = at ? { x: clamp(at.x - w / 2, -40, BW - w + 40), y: clamp(at.y - h / 2, -40, BH - h + 40) } : {};
      addItem({ type: 'img', src, w, h, ...pos });
    }
    async function addFiles(files, at) {
      const imgs = files.filter((f) => /^image\//.test(f.type));
      if (!imgs.length) { if (files.length) toast('Só dá para colocar imagens no mural.'); return; }
      toast(imgs.length > 1 ? `Adicionando ${imgs.length} fotos…` : 'Adicionando foto…');
      for (let i = 0; i < imgs.length; i++) {
        try {
          const r = await compressImage(imgs[i]);
          addImage(r.src, r.ratio, at ? { x: at.x + i * 30, y: at.y + i * 30 } : null);
        } catch (err) { toast('Não consegui abrir essa imagem.'); }

    }
    $('#file-img').addEventListener('change', (e) => { addFiles(Array.from(e.target.files || [])); e.target.value = ''; });
    document.addEventListener('paste', (e) => {

    function bindBoard() {
      on(el, 'click', '[data-vb]', (e, b) => {

        if (a === 'photo') $('#file-img').click();
        else if (a === 'sticker') stickerPicker((s) => addItem({ type: 'sticker', text: s, w: 120, h: 120, rot: [-10, 8, -4, 12][S.vision.items.length % 4] }), 'escolha um adesivo');
        else if (a === 'link') modal({
          title: 'foto por link', message: 'Cole o endereço de uma imagem. Ela precisa continuar disponível na internet.',
          fields: [{ name: 'url', label: 'Link da imagem', type: 'url', required: true, placeholder: 'https://…' }],
          onSave: (v) => {

            if (!/^https?:\/\//i.test(url)) { toast('O link precisa começar com http:// ou https://'); return false; }
            const img = new Image();

      const end = () => { if (!drag) return; const moved = drag.moved; drag.itemEl.classList.remove('dragging'); drag = null; if (moved) save(); };
      board.addEventListener('pointerup', end);

          if (it.type === 'sticker') stickerPicker((s) => { it.text = s; save(); render(); }, 'trocar adesivo');
          else if (it.type === 'img') { const copy = { ...it, id: undefined, x: it.x + 30, y: it.y + 30 }; addItem(copy); }
          else textModal(it.type, it);
        }
        else if (b.dataset.a === 'del') { S.vision.items = S.vision.items.filter((x) => x.id !== id); selId = null; save(); render(); }
      });
      board.addEventListener('dblclick', (e) => {
        const itemEl = e.target.closest('.vb-item');
        if (!itemEl || e.target.closest('[data-a]')) return;

      if ((e.key === 'Delete' || e.key === 'Backspace') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
        S.vision.items = S.vision.items.filter((x) => x.id !== selId); selId = null; save(); render();
      }
    });
    return { render };
  })();

  /* =========================================================
     MEU ANO
     ========================================================= */
  PAGES.ano = (() => {
    const el = $('#pg-ano');
    function yearData(y) {
      if (!S.anos[y]) S.anos[y] = { palavra: '', sentir: '', intencoes: {}, meses: Array(12).fill(''), desejos: [], carta: '' };
      return S.anos[y];
    }
    function wishesHTML(d, y) {
      const goal = y % 100;
      return `<ul class="wishes">${d.desejos.map((w, i) => `<li class="${w.done ? 'done' : ''}"><span class="n">${i + 1}.</span><input type="checkbox" class="check" data-wish="${w.id}" ${w.done ? 'checked' : ''} aria-label="Realizado"><span class="t">${esc(w.text)}</span><button class="icon-btn" data-del-wish="${w.id}" aria-label="Remover">${ICON.x}</button></li>`).join('')}</ul>
        ${d.desejos.length < goal ? `<form class="quick-add" id="wish-add"><input class="input" name="text" placeholder="algo que quero viver em ${y}… (${d.desejos.length}/${goal})" aria-label="Novo desejo" autocomplete="off"><button class="btn" type="submit">Adicionar</button></form>` : `<p class="muted">Você completou sua lista de ${goal}! ✨</p>`}`;
    }
    function render() {
      const y = Number(S.anoSel) || nextYear;
      const d = yearData(y);
      const goal = y % 100;

        <div class="page-head">
          <div><h1>meu ${y}</h1><div class="sub">palavra · sentimentos · <b>sonhos do ano</b></div></div>
          <div class="tabs" role="tablist">${years.sort().map((yy) => `<button class="tab ${yy === y ? 'on' : ''}" data-year="${yy}" role="tab" aria-selected="${yy === y}">${yy}</button>`).join('')}</div>
        </div>
        <div class="grid-2" style="margin-bottom:24px">
          <div class="card taped" style="text-align:center">
            <div class="eyebrow">minha palavra do ano</div>
            <input class="year-word" data-bind="palavra" value="${esc(d.palavra)}" placeholder="Florescer" aria-label="Palavra do ano">
          </div>
          <div class="card">
            ${CLIP}
            <div class="eyebrow" style="margin-bottom:8px">como eu quero me sentir</div>
            <textarea class="input" data-bind="sentir" rows="3" placeholder="leve, confiante, em paz com minhas escolhas…" aria-label="Como eu quero me sentir">${esc(d.sentir)}</textarea>
          </div>
        </div>
        <div class="card taped t-left">
          <div class="card-head"><h3>intenções para cada área</h3><span class="muted">salva sozinho ♡</span></div>
          <div class="areas-grid">
            ${Object.entries(AREAS).map(([k, a]) => `<div class="area-box" style="--c:${a.color}"><label for="int-${k}"><i class="dot" style="--c:${a.color}"></i>${a.label}</label><textarea id="int-${k}" data-bind="intencoes.${k}" placeholder="o que eu quero aqui?">${esc(d.intencoes[k] || '')}</textarea></div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>foco de cada mês</h3></div>
          <div class="months-grid">
            ${MONTHS.map((m, i) => `<div class="month-box ${y === now.getFullYear() && i === now.getMonth() ? 'now' : ''}"><label for="mes-${i}">${m}</label><textarea id="mes-${i}" data-bind="meses.${i}" placeholder="foco, datas especiais…">${esc(d.meses[i] || '')}</textarea></div>`).join('')}
          </div>
        </div>
        <div class="card taped t-butter">
          <div class="card-head"><h3>${goal} coisas para viver em ${y}</h3><span class="muted" id="wish-count">${d.desejos.filter((w) => w.done).length} realizadas</span></div>
          <div id="wishes-box">${wishesHTML(d, y)}</div>
        </div>
        <div class="card lined">
          <div class="card-head"><h3>carta para a eu do fim de ${y}</h3></div>
          <textarea class="letter" data-bind="carta" placeholder="querida eu, quando você ler isso…" aria-label="Carta para mim mesma">${esc(d.carta)}</textarea>
        </div>`;
    }
    function refreshWishes() {
      const y = Number(S.anoSel) || nextYear;
      const d = yearData(y);
      $('#wishes-box', el).innerHTML = wishesHTML(d, y);
      $('#wish-count', el).textContent = `${d.desejos.filter((w) => w.done).length} realizadas`;
    }
    el.addEventListener('input', (e) => {
      const path = e.target.dataset.bind;
      if (!path) return;
      const d = yearData(Number(S.anoSel) || nextYear);
      const [k, sub] = path.split('.');
      if (sub !== undefined) d[k][sub] = e.target.value; else d[k] = e.target.value;
      save();
    });
    on(el, 'click', '[data-year]', (e, b) => { S.anoSel = Number(b.dataset.year); save(); render(); });
    on(el, 'submit', '#wish-add', (e, f) => {
      e.preventDefault();
      const text = f.elements.text.value.trim();
      if (!text) return;
      yearData(Number(S.anoSel) || nextYear).desejos.push({ id: uid(), text, done: false });
      save(); refreshWishes();
      setTimeout(() => $('#wish-add input', el)?.focus(), 0);
    });
    on(el, 'change', '[data-wish]', (e, c) => {
      const d = yearData(Number(S.anoSel) || nextYear);
      const w = d.desejos.find((x) => x.id === c.dataset.wish);
      if (w) { w.done = c.checked; save(); refreshWishes(); if (w.done) toast('Mais um sonho vivido ✨'); }
    });
    on(el, 'click', '[data-del-wish]', (e, b) => {
      const d = yearData(Number(S.anoSel) || nextYear);
      d.desejos = d.desejos.filter((x) => x.id !== b.dataset.delWish); save(); refreshWishes();
    });
    return { render };
  })();

  /* =========================================================
     MAPA MENTAL
     ========================================================= */
  PAGES.mapa = (() => {
    const el = $('#pg-mapa');
    let built = false, selId = null, editingId = null;
    let canvas, layer, svg, nodesBox;

    const map = () => S.maps.find((m) => m.id === S.mapSel) || S.maps[0];
    const root = (m = map()) => m.nodes.find((n) => n.parent === null);
    const byId = (id) => map().nodes.find((n) => n.id === id);
    const children = (id) => map().nodes.filter((n) => n.parent === id);
    function subtree(id) {
      const out = [byId(id)];
      for (let i = 0; i < out.length; i++) out.push(...children(out[i].id));
      return out;
    }

    function build() {
      el.innerHTML = `
        <div class="page-head" style="margin-bottom:16px">
          <div><h1>mapa mental</h1><div class="sub">ideias · sonhos · <b>projetos</b></div></div>
        </div>
        <div class="mm-link" id="mm-link" hidden></div>
        <div class="mm-toolbar">
          <select class="input" id="mm-select" aria-label="Escolher mapa"></select>
          <button class="btn sm secondary" data-mm="new-map">+ Novo mapa</button>
          <button class="btn sm ghost" data-mm="rename-map">Renomear</button>
          <button class="btn sm ghost" data-mm="del-map">Apagar mapa</button>
          <span class="sep"></span>
          <button class="btn sm" data-mm="child">+ Ramo</button>
          <button class="btn sm secondary" data-mm="sibling">+ Irmão</button>
          <button class="btn sm ghost" data-mm="edit">Editar</button>
          <div class="mm-colors" aria-label="Cor do ramo">${MM_COLORS.map((c) => `<button style="--c:${c}" data-mm-color="${c}" aria-label="Cor ${c}"></button>`).join('')}</div>
          <button class="btn sm danger-ghost" data-mm="del">Excluir</button>
          <span class="sep"></span>
          <div class="mm-act" role="group" aria-label="Transformar a ideia selecionada">
            <button class="btn sm secondary" data-mm="to-idea">💡 Virar ideia</button>
            <button class="btn sm secondary" data-mm="to-task">✅ Virar tarefa</button>
            <button class="btn sm secondary" data-mm="to-step">🎯 Virar passo de meta</button>
          </div>
        </div>
        <div class="mm-canvas" id="mm-canvas" tabindex="0" aria-label="Mapa mental. Use Tab para criar ramo, Enter para criar irmão, Delete para excluir.">
          <div class="mm-layer" id="mm-layer"><svg id="mm-svg" aria-hidden="true"></svg><div id="mm-nodes"></div></div>
          <div class="mm-zoom">
            <button class="icon-btn" data-zoom="1.2" aria-label="Aproximar">${ICON.plus}</button>
            <button class="icon-btn" data-zoom="0.833" aria-label="Afastar">${ICON.minus}</button>
            <button class="icon-btn" data-mm="center" aria-label="Centralizar">${ICON.target}</button>
          </div>
        </div>
        <p class="mm-hint">Clique numa ideia para selecionar · duplo clique para editar · arraste para mover (os ramos vão junto) · arraste o fundo para navegar · <kbd>Tab</kbd> novo ramo · <kbd>Enter</kbd> novo irmão · <kbd>Delete</kbd> excluir</p>`;
      canvas = $('#mm-canvas', el);
      layer = $('#mm-layer', el);
      svg = $('#mm-svg', el);
      nodesBox = $('#mm-nodes', el);
      bind();
      built = true;
    }

    function view() {
      const m = map();
      if (!m.view) centerView();
      return m.view;
    }
    function centerView() {
      const m = map();
      const r = root(m);
      const w = canvas.clientWidth || 800, h = canvas.clientHeight || 500;
      // fit all nodes
      const xs = m.nodes.map((n) => n.x), ys = m.nodes.map((n) => n.y);
      const minX = Math.min(...xs) - 140, maxX = Math.max(...xs) + 140, minY = Math.min(...ys) - 60, maxY = Math.max(...ys) + 60;
      const z = clamp(Math.min(w / (maxX - minX), h / (maxY - minY)), 0.25, 1.2);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      m.view = { x: w / 2 - cx * z, y: h / 2 - cy * z, z };
      if (!r) m.view = { x: w / 2, y: h / 2, z: 1 };
    }
    function applyView() {
      const v = view();
      layer.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.z})`;
    }
    function zoomAt(sx, sy, f) {
      const v = view();
      const nz = clamp(v.z * f, 0.25, 2.5);
      v.x = sx - (sx - v.x) * (nz / v.z);
      v.y = sy - (sy - v.y) * (nz / v.z);
      v.z = nz;
      applyView(); save();
    }

    function edgePath(p, c) {
      const dx = c.x - p.x;
      const mx = p.x + dx / 2;
      return `M${p.x},${p.y} C${mx},${p.y} ${mx},${c.y} ${c.x},${c.y}`;
    }
    function drawEdges() {
      const m = map();
      const r = root(m);
      svg.innerHTML = m.nodes.filter((n) => n.parent).map((n) => {
        const p = byId(n.parent);
        if (!p) return '';
        return `<path d="${edgePath(p, n)}" fill="none" stroke="${n.color}" stroke-width="${p === r ? 4 : 2.5}" stroke-linecap="round" opacity=".85"/>`;
      }).join('');
    }
    function drawNodes() {
      const m = map();
      nodesBox.innerHTML = m.nodes.map((n) => `<div class="mm-node ${n.parent === null ? 'root' : ''} ${n.id === selId ? 'sel' : ''}" data-id="${n.id}" ${n.mark ? `data-mark="${n.mark}"` : ''} style="left:${n.x}px;top:${n.y}px;--c:${n.color}">${esc(n.text)}</div>`).join('');
    }

    function render() {
      if (!built) build();
      if (!map()) { S.maps = seed().maps; S.mapSel = S.maps[0].id; }
      $('#mm-select', el).innerHTML = S.maps.map((m) => `<option value="${m.id}" ${m.id === S.mapSel ? 'selected' : ''}>${m.link ? (m.link.type === 'goal' ? '🎯 ' : '🗂️ ') : ''}${esc(m.name)}</option>`).join('');
      const lk = map().link;
      const lkEl = $('#mm-link', el);
      if (lkEl) {
        let html = '';
        if (lk && lk.type === 'folder') { const f = S.biz.folders.find((x) => x.id === lk.id); if (f) html = `<span>🗂️ Mapa de ideias da pasta <b>${esc(f.emoji + ' ' + f.name)}</b>. “Virar ideia” já salva nessa pasta.</span><button class="btn sm ghost" data-mm-goto="folder">abrir pasta</button>`; }
        else if (lk && lk.type === 'goal') { const g = S.goals.find((x) => x.id === lk.id); if (g) html = `<span>🎯 Mapa da meta <b>${esc(g.title)}</b>. “Virar passo” já adiciona nessa meta.</span><button class="btn sm ghost" data-mm-goto="goal">abrir metas</button>`; }
        lkEl.innerHTML = html; lkEl.hidden = !html;
      }
      if (selId && !byId(selId)) selId = null;
      drawEdges(); drawNodes();
      requestAnimationFrame(applyView);
    }

    function convertNode(n, a) {
      const m = map();
      const text = n.text.trim();
      const from = `Do mapa “${m.name}”`;
      if (a === 'to-idea') {
        const folderId = m.link && m.link.type === 'folder' && S.biz.folders.find((f) => f.id === m.link.id) ? m.link.id : (S.biz.folders[0]?.id || '');
        S.biz.posts.push({ id: uid(), title: text.length > 80 ? text.slice(0, 77) + '…' : text, folderId, platform: 'instagram', format: 'reels', status: 'ideia', date: '', time: '', hook: '', script: '', caption: '', hashtags: '', scene: '', look: '', duration: '', link: '', notes: from, checklist: [], createdAt: today() });
        n.mark = '💡'; save(); drawNodes(); toast('Virou ideia de conteúdo 💡 (Conteúdo → Ideias)');
      } else if (a === 'to-task') {
        S.tasks.items.push({ id: uid(), listId: S.tasks.lists[0]?.id, text: text.slice(0, 140), done: false, prio: 'normal', due: today(), notes: from, remind: '' });
        n.mark = '✅'; save(); drawNodes(); toast('Virou tarefa de hoje ✅');
      } else {
        const addStep = (g) => { g.steps = g.steps || []; g.steps.push({ id: uid(), text: text.slice(0, 140), done: false }); n.mark = '🎯'; save(); drawNodes(); toast(`Virou passo da meta “${g.title}” 🎯`); };
        const linked = m.link && m.link.type === 'goal' && S.goals.find((g) => g.id === m.link.id);
        if (linked) { addStep(linked); return; }
        if (!S.goals.length) { toast('Crie uma meta primeiro (Mais → Metas).'); return; }
        modal({
          title: 'virar passo de qual meta?',
          fields: [{ name: 'goal', label: 'Meta', type: 'select', value: S.goals[0].id, options: S.goals.map((g) => ({ value: g.id, label: g.title })) }],
          saveLabel: 'Adicionar passo',
          onSave: (v) => { const g = S.goals.find((x) => x.id === v.goal); if (g) addStep(g); },
        });
      }
    }

    function select(id) {
      selId = id;
      $$('.mm-node', nodesBox).forEach((n) => n.classList.toggle('sel', n.dataset.id === id));
    }

    function addNode(parentId) {
      const m = map();
      const p = byId(parentId);
      if (!p) return;
      const r = root(m);
      const kids = children(p.id);
      let x, y, color;
      if (p === r) {
        const ang = (kids.length * 2 * Math.PI) / 6 - Math.PI / 4;
        x = p.x + Math.cos(ang) * 270; y = p.y + Math.sin(ang) * 170;
        const used = kids.map((k) => k.color);
        color = MM_COLORS.find((c) => !used.includes(c) && c !== r.color) || MM_COLORS[kids.length % MM_COLORS.length];
      } else {
        const dir = p.x >= r.x ? 1 : -1;
        x = p.x + dir * 220;
        y = kids.length ? Math.max(...kids.map((k) => k.y)) + 64 : p.y;
        color = p.color;
      }
      const n = { id: uid(), parent: p.id, x: Math.round(x), y: Math.round(y), text: 'Nova ideia', color };
      m.nodes.push(n);
      save();
      selId = n.id;
      drawEdges(); drawNodes();
      startEdit(n.id, true);
    }

    function deleteNode(id) {
      const n = byId(id);
      if (!n) return;
      if (n.parent === null) { toast('A ideia central não pode ser excluída — edite o texto dela.'); return; }
      const ids = new Set(subtree(id).map((x) => x.id));
      const doIt = () => {
        const m = map();
        m.nodes = m.nodes.filter((x) => !ids.has(x.id));
        selId = n.parent; save(); render();
      };
      if (ids.size > 1) confirmBox('Excluir ideia?', `“${n.text}” e ${ids.size - 1} ideia(s) ligada(s) a ela serão removidas.`, doIt);
      else doIt();
    }

    function startEdit(id, selectAll) {
      const nEl = $(`.mm-node[data-id="${id}"]`, nodesBox);
      const n = byId(id);
      if (!nEl || !n) return;
      editingId = id;
      select(id);
      try { nEl.contentEditable = 'plaintext-only'; } catch (e) { nEl.contentEditable = 'true'; }
      if (nEl.contentEditable !== 'plaintext-only') nEl.contentEditable = 'true';
      nEl.setAttribute('contenteditable', nEl.contentEditable);
      nEl.focus();
      const range = document.createRange();
      range.selectNodeContents(nEl);
      if (!selectAll) range.collapse(false);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(range);
      const finish = (commit) => {
        if (editingId !== id) return;
        editingId = null;
        if (commit) n.text = nEl.innerText.replace(/\n+$/, '').trim() || 'Ideia';
        nEl.removeAttribute('contenteditable');
        save(); drawNodes(); drawEdges();
        canvas.focus({ preventScroll: true });
      };
      nEl.addEventListener('blur', () => finish(true), { once: true });
      nEl.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); nEl.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
    }

    function bind() {
      $('#mm-select', el).addEventListener('change', (e) => { S.mapSel = e.target.value; selId = null; save(); render(); });

      on(el, 'click', '[data-mm]', (e, b) => {
        const a = b.dataset.mm;
        const m = map();
        if (a === 'new-map') modal({
          title: 'Novo mapa mental', fields: [{ name: 'name', label: 'Tema central', required: true, placeholder: 'Ex: Meu negócio, Viagem dos sonhos…' }],
          onSave: (v) => {
            const name = v.name.trim();
            const nm = { id: uid(), name, nodes: [{ id: uid(), parent: null, x: 0, y: 0, text: name, color: '#b04a74' }], view: null };
            S.maps.push(nm); S.mapSel = nm.id; selId = nm.nodes[0].id; save(); render();
          },
        });
        else if (a === 'rename-map') modal({
          title: 'Renomear mapa', fields: [{ name: 'name', label: 'Nome', value: m.name, required: true }],
          onSave: (v) => { m.name = v.name.trim(); save(); render(); },
        });
        else if (a === 'del-map') {
          if (S.maps.length === 1) { toast('Você precisa ter pelo menos um mapa.'); return; }
          confirmBox('Excluir mapa?', `“${m.name}” e todas as ideias dele serão removidos.`, () => {
            S.maps = S.maps.filter((x) => x.id !== m.id); S.mapSel = S.maps[0].id; selId = null; save(); render();
          });
        }
        else if (a === 'child') addNode(selId || root().id);
        else if (a === 'sibling') {
          const n = selId && byId(selId);
          addNode(n && n.parent ? n.parent : root().id);
        }
        else if (a === 'edit') { if (selId) startEdit(selId, true); else toast('Selecione uma ideia primeiro.'); }
        else if (a === 'del') { if (selId) deleteNode(selId); else toast('Selecione uma ideia primeiro.'); }
        else if (a === 'center') { centerView(); applyView(); save(); }
        else if (a === 'to-idea' || a === 'to-task' || a === 'to-step') {
          const n = selId && byId(selId);
          if (!n) { toast('Toque numa ideia do mapa primeiro.'); return; }
          convertNode(n, a);
        }
      });
      on(el, 'click', '[data-mm-goto]', (e, b) => {
        const lk = map().link;
        if (!lk) return;
        if (b.dataset.mmGoto === 'folder') { S.ui.contFolder = lk.id; S.ui.contTab = 'ideias'; save(); go('conteudo'); }
        else go('metas');
      });
      on(el, 'click', '[data-mm-color]', (e, b) => {
        if (!selId) { toast('Selecione uma ideia para mudar a cor.'); return; }
        const r = root();
        const targets = selId === r.id ? [r] : subtree(selId);
        targets.forEach((n) => { n.color = b.dataset.mmColor; });
        save(); drawEdges(); drawNodes();
      });
      on(el, 'click', '[data-zoom]', (e, b) => zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, Number(b.dataset.zoom)));

      // pointer interactions
      const pts = new Map();
      let drag = null, pan = null, pinch = null;

      canvas.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.mm-zoom')) return;
        const nodeEl = e.target.closest('.mm-node');
        if (nodeEl && nodeEl.dataset.id === editingId) return;
        if (editingId) document.activeElement.blur();
        if (nodeEl) {
          const id = nodeEl.dataset.id;
          select(id);
          const nodes = subtree(id);
          drag = { id, sx: e.clientX, sy: e.clientY, orig: nodes.map((n) => [n, n.x, n.y]), moved: false };
          canvas.setPointerCapture(e.pointerId);
          canvas.focus({ preventScroll: true });
          e.preventDefault();
          return;
        }
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        canvas.setPointerCapture(e.pointerId);
        canvas.focus({ preventScroll: true });
        if (pts.size === 2) {
          const [a, b] = [...pts.values()];
          pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) };
          pan = null;
        } else {
          select(null);
          const v = view();
          pan = { sx: e.clientX, sy: e.clientY, ox: v.x, oy: v.y };
          canvas.classList.add('panning');
        }
      });
      canvas.addEventListener('pointermove', (e) => {
        if (drag) {
          const z = view().z;
          const dx = (e.clientX - drag.sx) / z, dy = (e.clientY - drag.sy) / z;
          if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
          drag.moved = true;
          drag.orig.forEach(([n, ox, oy]) => {
            n.x = Math.round(ox + dx); n.y = Math.round(oy + dy);
            const ne = $(`.mm-node[data-id="${n.id}"]`, nodesBox);

  async function copyText(txt) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); return true; } } catch (e) { /* tenta o jeito antigo */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  function teleprompter(p) {
    let speed = 1, playing = false, raf = 0, last = 0;
    modal({
      title: 'teleprompter',
      extraHTML: `<div class="tele" id="tele">${(() => { const t = scriptFalas(p); return esc(t || `${p.hook ? p.hook + '\n\n' : ''}${p.script || 'Sem roteiro ainda.'}`); })()}</div>
        <div class="row"><button type="button" class="btn" id="tl-play">▶ começar</button><button type="button" class="btn sm secondary" id="tl-slow">− devagar</button><button type="button" class="btn sm secondary" id="tl-fast">+ rápido</button><span class="muted mono" id="tl-sp" style="font-family:var(--f-mono);font-size:12px">velocidade 1x</span></div>`,
      cancelLabel: 'Fechar',
      onOpen: (form) => {
        const box = $('#tele', form);
        const step = (ts) => { if (!playing) return; if (last) box.scrollTop += (ts - last) * 0.035 * speed; last = ts; raf = requestAnimationFrame(step); };
        $('#tl-play', form).addEventListener('click', (e) => { playing = !playing; e.currentTarget.textContent = playing ? '❚❚ pausar' : '▶ continuar'; last = 0; if (playing) raf = requestAnimationFrame(step); });
        const setSp = (d) => { speed = clamp(Math.round((speed + d) * 10) / 10, 0.4, 3); $('#tl-sp', form).textContent = `velocidade ${String(speed).replace('.', ',')}x`; };
        $('#tl-slow', form).addEventListener('click', () => setSp(-0.2));
        $('#tl-fast', form).addEventListener('click', () => setSp(0.2));
        dlg.addEventListener('close', () => { playing = false; cancelAnimationFrame(raf); }, { once: true });
      },
    });
  }

  function movePost(id, dir) {
    const p = B().posts.find((x) => x.id === id);
    if (!p) return;
    const i = clamp(ST_ORDER.indexOf(p.status) + dir, 0, ST_ORDER.length - 1);
    p.status = ST_ORDER[i];
    if (p.example) delete p.example;
    save(); rerender();
    if (p.status === 'publicado' && !p.metrics) toast('Publicado! Anote os resultados quando tiver ♥');
  }
  function bindPostActions(root) {
    root.addEventListener('click', (e) => {
      const mv = e.target.closest('[data-pmove]');
      if (mv && root.contains(mv)) { const [id, d] = mv.dataset.pmove.split(':'); movePost(id, Number(d)); return; }
      if (e.target.closest('button, a, input, select, textarea')) return;
      const card = e.target.closest('[data-post]');
      if (card && root.contains(card)) { const p = B().posts.find((x) => x.id === card.dataset.post); if (p) openPost(p); }
    });
    root.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const card = e.target.closest('.pcard[data-post]');
      if (card && e.target === card) { const p = B().posts.find((x) => x.id === card.dataset.post); if (p) openPost(p); }
    });
    root.addEventListener('dragstart', (e) => {
      const d = e.target.closest('[data-post][draggable]');
      if (d) { e.dataTransfer.setData('text/plain', d.dataset.post); e.dataTransfer.effectAllowed = 'move'; }
    });
    root.addEventListener('dragover', (e) => {
      const t = e.target.closest('[data-day], [data-col]');
      if (!t) return;
      e.preventDefault();
      $$('.over', root).forEach((x) => x !== t && x.classList.remove('over'));
      t.classList.add('over');
    });
    root.addEventListener('dragleave', (e) => { const t = e.target.closest('[data-day], [data-col]'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('over'); });
    root.addEventListener('drop', (e) => {
      const t = e.target.closest('[data-day], [data-col]');
      if (!t) return;
      e.preventDefault();
      const p = B().posts.find((x) => x.id === e.dataTransfer.getData('text/plain'));
      if (!p) return;
      if (t.dataset.day) { p.date = t.dataset.day; Object.keys(S.notified).forEach((k) => { if (k.startsWith('p:' + p.id + ':')) delete S.notified[k]; }); }
      if (t.dataset.col) p.status = t.dataset.col;
      if (p.example) delete p.example;
      save(); rerender();
    });
  }

    // confere os pedidos em andamento (ao abrir o app, ao voltar para ele e a cada poucos segundos)
    async check() {
      const a = this.st();

      const { data, error } = await Auth.sb.from('ai_jobs').select('id,status,result,error,created_at').in('id', a.jobs.map((x) => x.id));
      if (error || !data) return;
      let changed = false, newest = null, planDone = null;
      for (const row of data) {
        if (row.status === 'running') continue;
        const job = a.jobs.find((x) => x.id === row.id);
        if (!job) continue;
        a.jobs = a.jobs.filter((x) => x.id !== row.id); changed = true;
        if (row.status !== 'done' || !row.result) { toast(aiErr({ code: row.error })); continue; }

      if (lost.length) { a.jobs = a.jobs.filter((x) => !lost.includes(x)); changed = true; }

      if (newest) { a.cur = newest.id; toast(`✨ Pronto: ${newest.plan.titulo || 'seu vídeo'}. Está em Conteúdo → Assistente.`); }

  /* REDES SOCIAIS (conexão automática no endereço próprio) */
  const Social = {
    accounts: {}, daily: [], busy: false,
    async call(path, body) {
      const sb = await Auth.client();
      const { data } = await sb.auth.getSession();
      const r = await fetch(`${CFG.supabaseUrl}/functions/v1/social/${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${data.session ? data.session.access_token : ''}`, apikey: CFG.anonKey },
        body: JSON.stringify(body || {}),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(j.error || 'erro'), { code: j.error });
      return j;
    },
    async refresh(apply) {
      if (!inSupa || !Auth.user) return;
      const { data } = await Auth.sb.from('social_accounts').select('*');
      this.accounts = {};
      (data || []).forEach((a) => { this.accounts[a.platform] = a; });
      try { const { data: dl } = await Auth.sb.from('social_daily').select('platform,day,followers').order('day', { ascending: false }).limit(90); this.daily = dl || []; } catch (e) { this.daily = this.daily || []; }
      if (apply) await this.apply();

    },
    async connect(platform) {
      try {
        const j = await this.call('start', { platform, return_to: location.origin + location.pathname });
        location.href = j.url;
      } catch (e) {
        toast(e.code === 'not_configured' ? `A conexão com o ${PLATFORMS[platform].label} ainda não foi configurada: faltam as chaves do app (próximo passo).` : 'Não consegui iniciar a conexão. Tente de novo.');
      }
    },
    async syncNow() {
      if (this.busy) return;
      this.busy = true; rerender();
      try {
        const j = await this.call('sync');
        const bad = (j.results || []).filter((r) => !r.ok);
        this.busy = false;
        await this.refresh(true);
        toast(bad.length ? 'Uma conta não atualizou. Veja o aviso no cartão.' : 'Números atualizados ✨');
      } catch (e) { toast('Não consegui atualizar agora. Tente de novo.'); }
      finally { this.busy = false; rerender(); }
    },
    // tira do Bloom os posts que vieram de uma conta que não é mais a conectada
    forgetImported(keys) {
      if (!keys.size) return 0;
      let n = 0;
      B().posts = B().posts.filter((p) => {
        if (!p.ext || !keys.has(p.ext.key)) return true;
        const own = p.hook || p.script || p.scene || p.look || p.folderId || (p.notes && String(p.notes).trim());
        if (!own) { n++; return false; } // veio só da importação: sai
        delete p.ext; delete p.metrics; delete p.thumb; return true; // post planejado por ela: fica, sem os números da outra conta
      });
      save(); return n;
    },
    async choose() {
      let list = [];
      try { list = (await this.call('choices')).choices || []; } catch (e) { toast('Não consegui buscar as contas agora.'); return; }
      if (!list.length) { toast('Abrindo o Facebook para você escolher a conta…'); setTimeout(() => this.connect('instagram'), 900); return; }
      modal({
        title: 'qual Instagram usar?',
        message: list.length > 1 ? 'Você liberou mais de uma conta na tela do Facebook. Escolha a que o Bloom deve acompanhar (dá para trocar depois).' : 'Só uma conta foi liberada. Para usar outra, desconecte, conecte de novo e marque a conta certa na tela do Facebook.',
        extraHTML: `<div class="ig-pick">${list.map((c) => `<button type="button" class="ig-opt ${c.current ? 'on' : ''}" data-ig="${esc(c.ext_id)}">${c.avatar_url ? `<img src="${esc(c.avatar_url)}" alt="" referrerpolicy="no-referrer">` : '<span class="ig-av" aria-hidden="true">📷</span>'}<span class="ig-t"><b>@${esc(c.username || 'conta')}</b><span class="muted">página ${esc(c.page_name || '')}</span></span>${c.current ? '<span class="tagpill" style="--c:#5f8a52">conectada</span>' : ''}</button>`).join('')}</div>`,
        cancelLabel: 'Fechar',
        onOpen: (form) => form.addEventListener('click', async (e) => {
          const b = e.target.closest('[data-ig]');
          if (!b || b.classList.contains('on')) return;
          $$('.ig-opt', form).forEach((x) => { x.disabled = true; });
          b.querySelector('.ig-t .muted').textContent = 'conectando e buscando os números…';
          try {
            const { data: old } = await Auth.sb.from('social_posts').select('ext_id').eq('platform', 'instagram');
            const oldKeys = new Set((old || []).map((x) => 'instagram:' + x.ext_id));
            const j = await this.call('choose', { ext_id: b.dataset.ig });
            const removed = this.forgetImported(oldKeys);
            dlg.close();
            await this.refresh(true);
            const name = (list.find((c) => c.ext_id === b.dataset.ig) || {}).username || '';
            toast(j.sync && j.sync.ok ? `Pronto! Agora é @${name} ✨${removed ? ` (${removed} posts da outra conta saíram do Bloom)` : ''}` : 'Conta trocada, mas os números ainda não vieram. Toque em atualizar.');
          } catch (err) { toast('Não consegui trocar agora. Tente de novo.'); $$('.ig-opt', form).forEach((x) => { x.disabled = false; }); }
        }),
      });
    },
    disconnect(platform) {
      modal({
        title: `desconectar o ${PLATFORMS[platform].label}?`,
        message: 'Os números param de atualizar e a conexão e o token são apagados do nosso banco de dados.',
        fields: [{ name: 'keep', label: 'Posts já copiados para o seu planner', type: 'select', value: 'remove', full: true, options: [{ value: 'remove', label: 'Remover também (recomendado)' }, { value: 'keep', label: 'Manter no meu planner' }] }],
        saveLabel: 'Desconectar', danger: true,
        onSave: async (v) => {
          const keys = new Set(B().posts.filter((x) => x.ext && x.ext.platform === platform).map((x) => x.ext.key));
          try { await this.call('disconnect', { platform }); } catch (e) { toast('Não consegui desconectar agora.'); return false; }
          if (v.keep === 'remove') { const n = this.forgetImported(keys); toast(n ? `Desconectado. ${n} posts importados saíram do planner.` : 'Desconectado.'); } else toast('Desconectado. Os posts continuam no seu planner.');
          this.refresh(false); rerender();
        },
      });
    },
    async apply() {
      const { data, error } = await Auth.sb.from('social_posts').select('*').order('posted_at', { ascending: false }).limit(300);
      if (error || !data) return;
      // a conta conectada mudou: tira os posts importados da conta anterior
      B().extAcct = B().extAcct || {};
      for (const pl of Object.keys(PLATFORMS)) {
        const acc = this.accounts[pl];
        if (!acc || !acc.ext_user_id || B().extAcct[pl] === acc.ext_user_id) continue;
        const { data: ids, error: e2 } = await Auth.sb.from('social_posts').select('ext_id').eq('platform', pl).limit(5000);
        if (e2 || !ids) continue;
        const keep = new Set(ids.map((x) => pl + ':' + x.ext_id));
        const stale = new Set(B().posts.filter((x) => x.ext && x.ext.platform === pl && !keep.has(x.ext.key)).map((x) => x.ext.key));
        if (stale.size) this.forgetImported(stale);
        B().extAcct[pl] = acc.ext_user_id; save();
      }
      const ignored = new Set(B().ignoredExt || []);
      const words = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-z0-9]+/).filter((w) => w.length > 3);
      const overlap = (p, sp) => { const c = words(sp.caption); return words(p.title).filter((w) => c.includes(w)).length; };
      const titleFrom = (cap, pl) => { const t = String(cap || '').split('\n')[0].replace(/#\S+/g, '').trim(); return t ? (t.length > 60 ? t.slice(0, 57) + '…' : t) : `Post do ${PLATFORMS[pl].label}`; };
      let changed = false;
      for (const sp of data) {
        const key = sp.platform + ':' + sp.ext_id;
        if (ignored.has(key)) continue;
        const d = sp.posted_at ? new Date(sp.posted_at) : null;
        const date = d ? iso(d) : '';
        const time = d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
        let p = B().posts.find((x) => x.ext && x.ext.key === key);
        if (!p && date) {
          const cands = B().posts.filter((x) => !x.ext && x.platform === sp.platform && x.date && Math.abs(diffDays(x.date, date)) <= 1 && x.status !== 'ideia');
          p = cands.sort((a, b) => (overlap(b, sp) - overlap(a, sp)) || (Math.abs(diffDays(a.date, date)) - Math.abs(diffDays(b.date, date))))[0];
        }
        if (!p) {
          p = { id: uid(), title: titleFrom(sp.caption, sp.platform), folderId: '', platform: sp.platform, format: sp.media_type || 'post', status: 'publicado', date, time, hook: '', script: '', caption: sp.caption || '', hashtags: '', scene: '', look: '', duration: '', link: sp.permalink || '', notes: '', checklist: [], createdAt: today(), imported: true };
          B().posts.push(p);
          changed = true;
        }
        const m = sp.metrics || {};
        const api = { views: m.views ?? m.reach, reach: m.reach, likes: m.likes, comments: m.comments, saves: m.saves, shares: m.shares, follows: m.follows };
        const keep = p.metrics ? { clicks: p.metrics.clicks, sales: p.metrics.sales } : {};
        const next = Object.assign({}, keep, api, { at: String(sp.synced_at || '').slice(0, 10) || today(), auto: true });
        Object.keys(next).forEach((k) => { if (next[k] == null) delete next[k]; });
        const before = JSON.stringify([p.metrics, p.status, p.ext, p.link]);
        p.metrics = next;
        p.ext = { key, platform: sp.platform, id: sp.ext_id };
        p.status = 'publicado';
        if (!p.link) p.link = sp.permalink || '';
        if (sp.thumbnail_url && p.thumb !== sp.thumbnail_url) { p.thumb = sp.thumbnail_url; changed = true; }
        if (!p.date) { p.date = date; p.time = time; }
        if (p.example) delete p.example;
        if (JSON.stringify([p.metrics, p.status, p.ext, p.link]) !== before) changed = true;
      }
      if (changed) { save(); rerender(); }
    },
  };

  // Resumo dos resultados para a tela inicial (últimos 7 dias contra os 7 anteriores). Tudo calculado dos números dela, sem IA.
  function pulseData() {
    const t = today(), a = addDays(t, -6), pa = addDays(t, -13), pb = addDays(t, -7);
    const pubs = B().posts.filter((x) => x.status === 'publicado' && x.date && !x.example);
    const inR = (x, d1, d2) => x.date >= d1 && x.date <= d2;
    const cur = pubs.filter((x) => inR(x, a, t)), prev = pubs.filter((x) => inR(x, pa, pb));
    const views = (arr) => arr.reduce((n, x) => n + num(x.metrics && (x.metrics.views ?? x.metrics.reach)), 0);
    const inter = (x) => num(x.metrics.likes) + num(x.metrics.comments) + num(x.metrics.saves) + num(x.metrics.shares);
    const eng = (arr) => { const w = arr.filter((x) => x.metrics && num(x.metrics.reach) > 0); const r = w.reduce((n, x) => n + num(x.metrics.reach), 0); return r ? (w.reduce((n, x) => n + inter(x), 0) / r) * 100 : null; };
    const pct = (c, p0) => (p0 > 0 ? Math.round(((c - p0) / p0) * 100) : null);
    const v = views(cur), pv = views(prev), e = eng(cur), pe = eng(prev);
    // melhor formato nos últimos 30 dias
    const g = {}; pubs.filter((x) => x.metrics && inR(x, addDays(t, -29), t)).forEach((x) => { (g[x.format] = g[x.format] || []).push(num(x.metrics.views ?? x.metrics.reach)); });
    const avg = (arr) => arr.reduce((n, y) => n + y, 0) / arr.length;
    const fm = Object.entries(g).filter(([, arr]) => arr.length >= 2).map(([k, arr]) => ({ k, v: avg(arr), n: arr.length })).sort((x, y) => y.v - x.v);
    let best = null;
    if (fm.length >= 2 && fm[fm.length - 1].v > 0 && fm[0].v / fm[fm.length - 1].v >= 1.3) best = { top: fm[0].k, low: fm[fm.length - 1].k, x: Math.round((fm[0].v / fm[fm.length - 1].v) * 10) / 10 };
    // seguidores ganhos
    const dl = (Social.daily || []).filter((x) => x.platform === 'instagram'); let fol = null;
    if (dl.length >= 2) { const last = dl[0]; const old = dl.filter((x) => diffDays(x.day, last.day) <= 7).pop(); if (old && old.day !== last.day) fol = { n: last.followers - old.followers, since: old.day }; }
    const month = t.slice(0, 7), mp = B().posts.filter((x) => (x.date || '').startsWith(month) && !x.example);
    const connected = !!(inSupa && Social.accounts && Social.accounts.instagram);
    const hasData = pubs.some((x) => x.metrics);
    return { n: cur.length, v, dv: pct(v, pv), e, de: e != null && pe ? Math.round((e - pe) * 10) / 10 : null, best, fol, month: { done: mp.filter((x) => x.status === 'publicado').length, total: mp.length }, connected, hasData, upcoming: B().posts.filter((x) => x.date && x.date > t && x.date <= addDays(t, 7) && x.status !== 'publicado').length };
  }

  /* =========================================================
     LEMBRETES (notificações)

  let audioCtx = null;
  document.addEventListener('pointerdown', () => {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  }, { once: true });
  function chime() {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime;
      [1046.5, 1318.5, 1568].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t = t0 + i * 0.16;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.75);
      });
    } catch (e) {}
  }

  const Reminders = {
    today() {
      const t = today();
      const out = [];
      [t, addDays(t, 1)].forEach((d) => itemsOn(d).forEach((it) => {
        if (!hasRemind(it) || isDoneOn(it, d)) return;
        const st = msToStamp(remindAt(it, d));
        if (st.slice(0, 10) !== t) return;
        out.push({ at: st.slice(11), title: it.text, kind: it.time ? 'horário' : 'tarefa', key: 'i:' + it.id + ':' + d, when: it.time ? `${d === t ? 'hoje' : 'amanhã'} às ${it.time}` : '' });
      }));
      S.biz.posts.forEach((p) => { if (p.date === t && p.time && p.status !== 'publicado') out.push({ at: p.time, title: 'postar: ' + p.title, kind: 'conteúdo', key: 'p:' + p.id + ':' + p.date + 'T' + p.time }); });
      S.snoozes.forEach((z) => { const st = msToStamp(z.at); if (st.slice(0, 10) === t) out.push({ at: st.slice(11), title: z.title, kind: 'adiado', key: z.id }); });
      return out.sort((a, b) => a.at.localeCompare(b.at));
    },
    tick() {
      const now = Date.now();
      const stamp = nowStamp();
      const due = [];
      [addDays(today(), -1), today(), addDays(today(), 1)].forEach((d) => itemsOn(d).forEach((it) => {
        if (!hasRemind(it) || isDoneOn(it, d)) return;
        const key = 'i:' + it.id + ':' + d;
        if (S.notified[key]) return;
        const fire = remindAt(it, d);
        if (fire > now) return;
        S.notified[key] = now;
        if (now - fire < 3 * 3600000) due.push({ title: it.text, kind: it.time ? 'horário' : 'tarefa', taskId: it.id, date: d, when: it.time ? `${d === today() ? 'hoje' : d === addDays(today(), 1) ? 'amanhã' : fmtShort(d)} às ${it.time}` : '' });
      }));
      S.biz.posts.forEach((p) => {
        if (!p.date || !p.time || p.status === 'publicado') return;
        const st = p.date + 'T' + p.time;
        const key = 'p:' + p.id + ':' + st;
        if (S.notified[key] || st > stamp) return;
        S.notified[key] = now;
        if (now - stampToMs(st) < 3 * 3600000) due.push({ title: 'hora de postar: ' + p.title, kind: 'conteúdo', when: platOf(p).label + ' · ' + p.time });
      });
      const nowMin = Math.floor(now / 60000), every = nagEvery(), tday = today();
      const lt = new Date(), mod = lt.getHours() * 60 + lt.getMinutes(), WIN = 10;
      const slot = every ? Math.floor(mod / every) * every : -1;
      const inSlot = every > 0 && mod - slot < WIN && !quietNow();
      const ovH = [9, 14, 19].find((h) => mod >= h * 60 && mod < h * 60 + WIN);
      const round = [];
      pendingTasks().forEach(({ it, d }) => {
        const base = Math.floor(remindAt(it, d) / 60000), sn = it.snooze ? Math.floor(stampToMs(it.snooze) / 60000) : 0;
        const slotAbs = nowMin - (mod - slot);
        if (sn && sn > base) {
          if (nowMin < sn) return;
          if (nowMin - sn < WIN) { const k = `s:${it.id}:${d}:${sn}`; if (!S.notified[k]) { S.notified[k] = now; due.push({ title: it.text, kind: 'ainda pendente', taskId: it.id, date: d, when: sinceLabel(it, d) }); } return; }
          if (it.nag === 'off') return;
          if ((inSlot && slotAbs >= sn + every) || (ovH !== undefined && d !== tday)) round.push({ it, d });
          return;
        }
        if (it.nag === 'off') return;
        if (d === tday ? inSlot && slotAbs >= base + every : ovH !== undefined && !quietNow()) round.push({ it, d });
      });
      const rk = `g:${tday}:${inSlot ? slot : 'o' + ovH}`;
      if (round.length && !S.notified[rk]) {
        S.notified[rk] = now;
        if (round.length === 1) due.push({ title: round[0].it.text, kind: 'ainda pendente', taskId: round[0].it.id, date: round[0].d, when: sinceLabel(round[0].it, round[0].d) });
        else due.push({ title: `${round.length} tarefas ainda pendentes`, kind: 'ainda pendente', pend: round.map((x) => x.it.id + ':' + x.d), when: round.slice(0, 3).map((x) => x.it.text).join(' · ') });
      }
      S.snoozes = S.snoozes.filter((z) => { if (z.at <= now) { due.push({ title: z.title, kind: z.kind, taskId: z.taskId, date: z.date, when: 'adiado' }); return false; } return true; });
      if (due.length) { save(); due.forEach(showAlert); chime(); }
      updateBell();
    },
    prune() {
      const cut = Date.now() - 40 * 86400000;
      Object.keys(S.notified).forEach((k) => { if (S.notified[k] < cut) delete S.notified[k]; });
    },
  };

  /* Insistir até concluir: depois do 1º lembrete, repete até a tarefa ser marcada como feita */
  const nagEvery = () => (S.ui.nagMin === undefined || S.ui.nagMin === null ? 30 : Number(S.ui.nagMin) || 0);
  const NAG_OPTS = { '0': 'Não, avisar só uma vez', '15': 'A cada 15 minutos', '30': 'A cada 30 minutos', '60': 'A cada 1 hora', '120': 'A cada 2 horas' };
  function nagSlot(base, snooze, now, every, win) { // tudo em minutos
    let anchor = base, k0 = 1;
    if (snooze && snooze > base) { if (now < snooze) return null; anchor = snooze; k0 = 0; }
    if (now < anchor) return null;
    if (!every) return k0 === 0 && now - anchor < win ? { anchor, k: 0 } : null;
    const k = Math.floor((now - anchor) / every);
    if (k < k0) return null;
    return now - (anchor + k * every) < win ? { anchor, k } : null;
  }
  const quietNow = () => { const h = new Date().getHours(); return S.ui.nagQuiet !== false && (h >= 22 || h < 8); };
  // tarefas com lembrete que já passaram da hora e não foram concluídas
  function pendingTasks() {
    const t = today(), now = Date.now(), oldest = addDays(t, -14), out = [];
    S.tasks.items.forEach((it) => {
      if (!hasRemind(it)) return;
      const dates = isRep(it) ? [t] : (it.due <= t && it.due >= oldest ? [it.due] : []);
      dates.forEach((d) => {
        if (!occursOn(it, d) || isDoneOn(it, d)) return;
        if (remindAt(it, d) > now) return;
        out.push({ it, d });
      });
    });
    return out;
  }
  function sinceLabel(it, d) { return d === today() ? (it.time ? `era às ${it.time}` : 'era para hoje') : `atrasada desde ${DOW[dow(d)]} ${fmtShort(d)}`; }
  function snoozeTask(it, minutes) {
    let at;
    if (minutes === 'manha') { const d = addDays(today(), 1); at = `${d}T09:00`; }
    else at = msToStamp(Date.now() + minutes * 60000);
    it.snooze = at;
    return at;
  }
  function markDone(it, d) {
    if (isRep(it)) { it.doneDates = it.doneDates || {}; it.doneDates[d || today()] = true; } else { it.done = true; it.doneAt = today(); }
    delete it.snooze;
  }
  function pendingModal(only) {
    let list = pendingTasks();
    if (only && only.length) {
      const want = new Set(only);
      const picked = list.filter((x) => want.has(x.it.id + ':' + x.d) || want.has(x.it.id));
      if (picked.length) list = picked;
    }
    if (!list.length) { toast('Nada pendente agora ♥'); return; }
    const row = ({ it, d }) => `<div class="pend-row" data-pend="${it.id}" data-d="${d}">
        <div class="pend-txt"><b>${esc(it.text)}</b><span class="muted">${sinceLabel(it, d)}${it.snooze && stampToMs(it.snooze) > Date.now() ? ` · adiada até ${it.snooze.slice(0, 10) === today() ? it.snooze.slice(11) : 'amanhã ' + it.snooze.slice(11)}` : ''}</span></div>
        <div class="pend-act">
          <button type="button" class="btn sm" data-pa="done">✓ Concluí</button>
          <button type="button" class="btn sm secondary" data-pa="30">+30 min</button>
          <button type="button" class="btn sm secondary" data-pa="60">+1 h</button>
          <button type="button" class="btn sm ghost" data-pa="manha">amanhã 9h</button>
        </div>
      </div>`;
    modal({
      title: list.length === 1 ? 'ainda pendente' : `${list.length} tarefas pendentes`,
      extraHTML: `<p class="muted" style="margin:0 0 10px">Conclua ou escolha quando te lembro de novo. Vou continuar avisando até você marcar como feita.</p><div class="pend-list">${list.map(row).join('')}</div>`,
      cancelLabel: 'Fechar',
      onOpen: (form) => {
        form.addEventListener('click', (e) => {
          const b = e.target.closest('[data-pa]'); if (!b) return;
          const r = b.closest('[data-pend]');
          const it = S.tasks.items.find((x) => x.id === r.dataset.pend); if (!it) return;
          const a = b.dataset.pa;
          if (a === 'done') { markDone(it, r.dataset.d); toast('Concluída ♥ Arrasou!'); }
          else { const at = snoozeTask(it, a === 'manha' ? 'manha' : Number(a)); toast(`Combinado, te lembro ${at.slice(0, 10) === today() ? 'às ' + at.slice(11) : 'amanhã às ' + at.slice(11)}.`); }
          save(); rerender(); updateBell();
          r.remove();
          if (!$('.pend-row', form)) dlg.close();
        });
      },
    });
  }
  // abrir pelo toque na notificação (?task=id:data,id:data)
  function openFromUrl(url) {

      if (q) setTimeout(() => pendingModal(q.split(',').filter(Boolean)), 300);
    } catch (e) {}
  }

  function showAlert(a) {
    const box = $('#alerts');
    const div = document.createElement('div');
    div.className = 'alert taped';
    div.innerHTML = `<div class="eyebrow">🔔 lembrete · ${esc(a.kind)}${a.when ? ' · ' + esc(a.when) : ''}</div>

    div.addEventListener('click', (e) => {

      if (b.dataset.al === 'snooze' && a.taskId) { const it = S.tasks.items.find((x) => x.id === a.taskId); if (it) { snoozeTask(it, 30); toast('Vou te lembrar de novo em 30 minutos.'); } }
      else if (b.dataset.al === 'snooze') { S.snoozes.push({ id: uid(), at: Date.now() + 10 * 60000, title: a.title, kind: a.kind, taskId: a.taskId, date: a.date }); toast('Vou te lembrar de novo em 10 minutos.'); }

  function updateBell() {
    const hm = nowHM();
    const n = Reminders.today().filter((r) => !S.notified[r.key] && r.at >= hm).length;
    const b = $('#bell-badge');
    b.hidden = !n; b.textContent = n;
