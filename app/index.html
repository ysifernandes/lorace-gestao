  function icsText() {
    const E = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
    const DT = (d, t) => d.replace(/-/g, '') + 'T' + t.replace(':', '') + '00';
    const plus = (d, t, mins) => msToStamp(stampToMs(`${d}T${t}`) + mins * 60000);
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Bloom//Planner//PT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Bloom'];
    const RR = { daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY', monthly: 'FREQ=MONTHLY' };
    S.tasks.items.forEach((it) => {
      if (!it.due || (!it.time && !hasRemind(it)) || (!isRep(it) && it.done)) return;
      L.push('BEGIN:VEVENT', `UID:${it.id}@bloom`, `DTSTAMP:${stamp}`);
      if (it.time) {
        L.push('DTSTART:' + DT(it.due, it.time));
        const endSt = it.end && it.end > it.time ? `${it.due}T${it.end}` : plus(it.due, it.time, it.end ? 60 : 30);
        L.push('DTEND:' + DT(endSt.slice(0, 10), endSt.slice(11)));
      } else {
        L.push('DTSTART;VALUE=DATE:' + it.due.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(it.due, 1).replace(/-/g, ''));
      }
      if (RR[it.repeat]) L.push('RRULE:' + RR[it.repeat]);
      L.push('SUMMARY:' + E(it.text));
      if (it.notes) L.push('DESCRIPTION:' + E(it.notes));
      if (hasRemind(it)) {
        const off = it.time ? -Number(it.remindMin) : 540 - Number(it.remindMin);
        L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + E(it.text), `TRIGGER:${off < 0 ? '-' : ''}PT${Math.abs(off)}M`, 'END:VALARM');
      }
      L.push('END:VEVENT');
    });
    S.biz.posts.forEach((p) => {
      if (!p.date || !p.time || p.status === 'publicado') return;
      const end = plus(p.date, p.time, 15);
      L.push('BEGIN:VEVENT', `UID:${p.id}-post@bloom`, `DTSTAMP:${stamp}`, 'DTSTART:' + DT(p.date, p.time), 'DTEND:' + DT(end.slice(0, 10), end.slice(11)), 'SUMMARY:' + E(`${platOf(p).icon} Postar: ${p.title}`), 'DESCRIPTION:' + E([p.hook, p.caption, p.hashtags].filter(Boolean).join('\n\n')), 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + E('Hora de postar: ' + p.title), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }
  function saveFile(filename, blob, okMsg) {

  /* Notificações no celular (Web Push), no app instalado */
  const Push = {
    isIOS: () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
    standalone: () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true,
    supported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
    key() {
      const b64 = String(CFG && CFG.vapidKey || '');
      const pad = '='.repeat((4 - (b64.length % 4)) % 4);
      const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));

    async current() { const reg = await navigator.serviceWorker.getRegistration(); return reg ? reg.pushManager.getSubscription() : null; },
    async status() {

    async sync() { try { if ((await this.status()) === 'on') { this.active = true; await this.save(await this.current()); } } catch (e) { /* tenta de novo na próxima abertura */ } },

        denied: `<p>As notificações do Bloom estão bloqueadas neste ${dev}. ${this.deniedHelp()}</p>`,
        on: `<p>Ativadas neste ${dev} ✓ Os lembretes das tarefas e a hora de postar chegam mesmo com o Bloom fechado.${others}</p>${this.isMobile() ? '<p class="muted" style="font-size:13px">Para receber também no computador, entre no Bloom pelo navegador do computador e ative lá.</p>' : '<p class="muted" style="font-size:13px">No computador, os avisos chegam enquanto o navegador estiver aberto (mesmo sem a aba do Bloom). Se não aparecer, confira se as notificações do navegador estão liberadas nos ajustes do sistema.</p>'}`
          + '<div class="row"><button type="button" class="btn sm secondary" id="push-test">Enviar teste</button><button type="button" class="btn sm ghost" id="push-off">Desativar</button></div>',
        off: `<p>Receba os lembretes das tarefas e a hora de postar <b>mesmo com o Bloom fechado</b>.${n ? ` Já estão ativadas em ${n === 1 ? 'outro aparelho' : n + ' outros aparelhos'}; ative aqui também para receber neste ${dev}.` : ''}</p><button type="button" class="btn sm" id="push-on">🔔 Ativar notificações neste ${dev}</button>`,
      };
      return T[st] || '';
    },
  };

  $('#btn-bell').addEventListener('click', async () => {

        <div class="settings-block">

  /* =========================================================
     Assistente de comandos: "mover os compromissos de hoje para amanhã", "reagendar os vídeos da semana".

  /* Escuta de uma frase (para o assistente): termina sozinha quando a pessoa para de falar */
  const Listen = {
    SR: window.SpeechRecognition || window.webkitSpeechRecognition, rec: null,
    ok() { return !!this.SR; },
    stop() { const r = this.rec; this.rec = null; if (r) { r.__off = true; try { r.abort ? r.abort() : r.stop(); } catch (e) { /* já parou */ } } },
    start({ onText, onDone, onFail }) {
      this.stop();
      let r; try { r = new this.SR(); } catch (e) { onFail('unavailable'); return; }

      r.onresult = (e) => {
        final = ''; interim = '';
        for (let i = 0; i < e.results.length; i++) { const x = e.results[i]; if (x.isFinal) final += x[0].transcript + ' '; else interim += x[0].transcript; }
        onText((final + interim).trim());
        clearTimeout(silence); silence = setTimeout(() => { try { r.stop(); } catch (x) { /* já parou */ } }, 1500); // parou de falar: encerra e executa
      };
      r.onerror = (e) => { const c = e && e.error; if (c === 'aborted') return; done(c === 'not-allowed' || c === 'service-not-allowed' ? 'denied' : c === 'no-speech' ? 'nospeech' : 'error'); };
      r.onend = () => done('nospeech');
      hard = setTimeout(() => { try { r.stop(); } catch (x) { /* já parou */ } }, 15000); // ninguém falou: desiste
      try { r.start(); } catch (e) { done('error'); }
    },
  };
  /* Voz de resposta (o aparelho lê o texto em voz alta) */
  const Say = {
    ok() { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; },
    // o iPhone só deixa falar depois de um toque: um toque inicial "destrava" a voz para as respostas seguintes
    unlock() { if (!this.ok() || this._u) return; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); this._u = true; } catch (e) { /* sem voz */ } },
    clean: (t) => String(t || '').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').replace(/[*_#>`~]/g, ' ').replace(/\s+/g, ' ').trim(),
    voice() { try { const v = speechSynthesis.getVoices(); return v.find((x) => /^pt[-_]BR/i.test(x.lang)) || v.find((x) => /^pt/i.test(x.lang)) || null; } catch (e) { return null; } },
    stop() { this.on = false; try { clearTimeout(this._t); speechSynthesis.cancel(); } catch (e) { /* sem voz */ } },
    speak(text, onend) {

    // o que vai para a Claude: só o necessário, cortado aqui (o servidor corta de novo)
    context(text) {
      const t = today(), from = addDays(t, -7), to = addDays(t, 60), cut = (v, n) => String(v || '').slice(0, n);
      const tarefas = [];
      for (const it of S.tasks.items) {

      }

      const open = B().posts.filter((x) => !x.example && x.status !== 'publicado' && ((x.date && x.date >= from && x.date <= to) || !x.date));
      const conteudos = open.sort((a, b2) => (a.date || '9').localeCompare(b2.date || '9')).slice(0, 100).map((x) => ({ id: x.id, t: cut(x.title, 80), data: x.date || '', hora: x.time || '', formato: x.format, status: x.status, pilar: cut(fname(x.folderId), 30), gancho: cut(x.hook, 80), tem_roteiro: !!x.script }));
      const mt = (x) => x.metrics || {};
      const publicados = B().posts.filter((x) => !x.example && x.status === 'publicado' && x.date && x.date >= addDays(t, -45) && x.metrics).sort((a, b2) => b2.date.localeCompare(a.date)).slice(0, 40)
        .map((x) => ({ t: cut(x.title, 60), data: x.date, formato: x.format, views: num(mt(x).views ?? mt(x).reach), alcance: num(mt(x).reach), curtidas: num(mt(x).likes), comentarios: num(mt(x).comments), salvos: num(mt(x).saves), compartilhamentos: num(mt(x).shares) }));
      let ins = null;
      try {
        const d = pulseData(), ig = (Social.accounts || {}).instagram;

      } catch (e) { ins = null; }
      const habitos = S.habits.slice(0, 12).map((h) => ({ nome: cut(h.name, 40), meta_por_semana: h.goal, feitos_nesta_semana: weekCount(h), feito_hoje: !!(h.days && h.days[t]) }));
      const metas = (S.goals || []).filter((g) => !g.done).slice(0, 15).map((g) => ({ titulo: cut(g.title, 60), prazo: g.deadline || '', atual: g.target ? g.current : null, alvo: g.target || null, unidade: g.unit || '' }));
      const notas = [...(S.notes || [])].sort((a, b2) => (b2.at || 0) - (a.at || 0)).slice(0, 10).map((n) => cut(n.text || n.t || n, 120));
      const calendario = Array.from({ length: 21 }, (_, i) => { const d = addDays(t, i - 1); return { data: d, dia: this.DOWS[dow(d)] }; });
      return { texto: cut(String(text).trim(), 500), hoje: t, dia_semana: this.DOWS[dow(t)], calendario, tarefas: tarefas.slice(0, 140), conteudos, publicados, insights: ins, habitos, metas, notas };
    },
    // confere cada ação que a Claude sugeriu contra os dados reais. O que não bate é descartado.
    plan(res) {
      const out = [], t = today(), notes = [];
      for (const a of (res && Array.isArray(res.acoes) ? res.acoes : []).slice(0, 80)) {
        const nd = a.nova_data, nt = this.okTime(a.novo_horario) ? a.novo_horario : '';
        if (a.alvo === 'conteudo') {
          const p = B().posts.find((x) => x.id === a.id);
          if (!p || p.status === 'publicado' || !this.ok(nd)) continue;

        }
        const it = S.tasks.items.find((x) => x.id === a.id);
        if (!it) continue;
        if (a.tipo === 'mudar_serie') {
          const di = this.DOWS.indexOf(a.novo_dia_semana);
          if (di < 0 || !isRep(it) || it.repeat !== 'weekly') { notes.push(`“${it.text}” não é uma tarefa semanal, então não mudei o dia dela.`); continue; }
          const base = it.due > t ? it.due : t, first = addDays(base, (di - dow(base) + 7) % 7);
          out.push({ kind: 'series', id: it.id, icon: '🔁', title: it.text, fromLabel: `toda ${DOW_LONG[dow(it.due)]}`, toLabel: `toda ${DOW_LONG[di]}`, to: first, time: nt });
          continue;
        }
        if (!this.ok(nd)) continue;
        if (isRep(it)) {
          const od = this.ok(a.data_origem) ? a.data_origem : t;
          if (!occursOn(it, od) || isDoneOn(it, od)) continue;
          out.push({ kind: 'occ', id: it.id, icon: '🔁', title: it.text, from: od, to: nd, time: nt });
        } else if (!it.done) out.push({ kind: 'task', id: it.id, icon: '📝', title: it.text, from: it.due, to: nd, time: nt });
      }
      // nada repetido: o mesmo item não entra duas vezes no mesmo dia de origem
      const seen = new Set();
      return { items: out.filter((x) => { const k = x.kind + x.id + (x.from || ''); if (seen.has(k)) return false; seen.add(k); return true; }), notes };
    },
    label(x) {
      const d = (s) => (s ? `${fmtShort(s)} (${DOW[dow(s)]})` : 'sem data');
      if (x.kind === 'series') return `${esc(x.fromLabel)} → <b>${esc(x.toLabel)}</b> <span class="muted">(a próxima será ${d(x.to)}${x.time ? ' às ' + x.time : ''})</span>`;
      return `${d(x.from)} → <b>${d(x.to)}</b>${x.time ? ` <span class="muted">às ${x.time}</span>` : ''}${x.kind === 'occ' ? ' <span class="muted">só este dia, a série continua</span>' : ''}`;
    },
    apply(items) {
      const snap = JSON.stringify({ tasks: S.tasks.items, posts: S.biz.posts });
      let n = 0;
      for (const x of items) {
        if (x.kind === 'post') { const p = B().posts.find((q) => q.id === x.id); if (!p) continue; p.date = x.to; if (x.time) p.time = x.time; n++; }
        else {
          const it = S.tasks.items.find((q) => q.id === x.id); if (!it) continue;
          if (x.kind === 'task') { it.due = x.to; if (x.time) it.time = x.time; delete it.snooze; n++; }
          else if (x.kind === 'series') { it.due = x.to; if (x.time) it.time = x.time; delete it.snooze; n++; }
          else if (x.kind === 'occ') {
            it.skipDates = Object.assign({}, it.skipDates, { [x.from]: true });
            const c = JSON.parse(JSON.stringify(it)); delete c.skipDates; delete c.snooze;
            Object.assign(c, { id: uid(), repeat: 'none', due: x.to, done: false, doneDates: {}, movedFrom: it.id }); if (x.time) c.time = x.time;
            S.tasks.items.push(c); n++;
          }
        }
      }
      if (n) { this.undoSnap = snap; save(); rerender(); this.undoBar(n); }
      return n;
    },
    undo() {
      if (!this.undoSnap) return;
      const o = JSON.parse(this.undoSnap); S.tasks.items = o.tasks; S.biz.posts = o.posts; this.undoSnap = null;
      save(); rerender(); const b = $('#cmd-undo'); if (b) b.remove(); toast('Desfeito.');
    },
    undoBar(n) {
      let b = $('#cmd-undo'); if (b) b.remove();
      b = document.createElement('div'); b.id = 'cmd-undo'; b.className = 'cmd-undo'; b.setAttribute('role', 'status');
      b.innerHTML = `<span>✓ ${n} ${n === 1 ? 'mudança feita' : 'mudanças feitas'}</span><button type="button" class="btn sm ghost">desfazer</button>`;
      b.querySelector('button').addEventListener('click', () => this.undo());
      document.body.appendChild(b); setTimeout(() => { if (b.isConnected) b.remove(); }, 20000);
    },
    async ask(text) {
      if (typeof Social === 'undefined') throw new Error('x');
      return Social.call('command', this.context(text));
    },
    open(o = {}) {
      if (dlg.open) return;
      Say.unlock();
      if (typeof Voice !== 'undefined' && Voice.kill) Voice.kill();
      const speakOn = () => { try { return localStorage.getItem('bloom_cmd_speak') !== '0'; } catch (e) { return true; } };
      modal({
        title: 'assistente', cancelLabel: 'Fechar', wide: false,
        extraHTML: `<div class="cmd">
          <div class="cmd-top"><button type="button" class="cmd-mic" id="cmd-mic" aria-label="Falar com o assistente" title="Falar">${MIC_SVG}</button><div class="cmd-st" id="cmd-st" role="status" aria-live="polite">Toque no microfone e fale.</div></div>
          <div class="cmd-type"><textarea class="input" id="cmd-text" rows="2" placeholder="ou escreva aqui: quais os compromissos de amanhã?" aria-label="O que você quer saber ou fazer"></textarea><button type="button" class="btn" id="cmd-go">Enviar</button></div>
          <label class="cmd-opt"><input type="checkbox" class="check" id="cmd-speak" ${speakOn() ? 'checked' : ''}> responder em voz alta</label>
          <div id="cmd-out" aria-live="polite"></div>
          <details class="cmd-help"><summary>o que posso pedir</summary><ul><li>quais são os compromissos de amanhã?</li><li>quais conteúdos tenho para gravar amanhã?</li><li>que ideias de conteúdo tenho na agenda?</li><li>como foram meus resultados no Instagram?</li><li>como estão meus hábitos e minhas metas?</li><li>mover os compromissos de hoje para amanhã</li><li>reagendar os vídeos dessa semana para a semana que vem</li><li>mudar a reunião de toda sexta para toda segunda</li></ul></details>
        </div>`,
        onOpen: (form) => {
          const out = $('#cmd-out', form), go = $('#cmd-go', form), ta = $('#cmd-text', form), st = $('#cmd-st', form), mic = $('#cmd-mic', form), chk = $('#cmd-speak', form);
          let dead = false, busy = false, doConfirm = null, doCancel = null;
          dlg.addEventListener('close', () => { dead = true; Listen.stop(); Say.stop(); }, { once: true });
          const setSt = (t, cls) => { st.textContent = t || 'Toque no microfone para falar.'; st.className = 'cmd-st' + (cls ? ' ' + cls : ''); };
          chk.addEventListener('change', () => { try { localStorage.setItem('bloom_cmd_speak', chk.checked ? '1' : '0'); } catch (e) { /* sem armazenamento */ } if (!chk.checked) Say.stop(); });
          const listen = (mode) => {
            if (dead) return false;
            if (!Listen.ok()) { setSt('Seu aparelho não liberou o microfone aqui. Escreva abaixo, ou use o 🎤 do teclado.'); return false; }
            Say.stop(); mic.classList.add('on'); setSt('Ouvindo… pode falar', 'listen');
            Listen.start({
              onText: (t) => { if (mode === 'ask') ta.value = t; setSt('“' + t + '”', 'listen'); },
              onDone: (t) => { mic.classList.remove('on'); if (dead) return; if (mode === 'confirm') return answerConfirm(t); ta.value = t; submit(t, true); },
              onFail: (why) => { mic.classList.remove('on'); if (dead) return; setSt(why === 'denied' ? 'O microfone não foi liberado. Libere nas configurações do aparelho, ou escreva abaixo.' : why === 'nospeech' ? 'Não ouvi nada. Toque no microfone para tentar de novo.' : 'Não consegui ouvir agora. Toque no microfone ou escreva abaixo.'); },
            });
            return true;
          };
          const norm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z ]/g, ' ').trim();
          const answerConfirm = (t) => {
            const n = norm(t);
            if (/^(sim|confirm|pode|isso|ok|certo|manda|faz|claro|positivo|vai)/.test(n) && doConfirm) { setSt('Feito.'); doConfirm(); }
            else if (/^(nao|cancel|deixa|para|esquece|negativo)/.test(n) && doCancel) { doCancel(); }
            else setSt('Não entendi. Toque em Confirmar ou Cancelar.');
          };
          const speak = (text, then) => {
            if (dead) return;
            if (!chk.checked || !Say.ok()) { setSt(''); if (then) then(); return; }
            setSt('Falando…', 'say'); out.querySelectorAll('[data-say]').forEach((b) => { b.textContent = '⏹ parar'; });
            Say.speak(text, () => { out.querySelectorAll('[data-say]').forEach((b) => { b.textContent = '🔊 ouvir'; }); if (dead) return; setSt(''); if (then) then(); });
          };
          const bindSay = (text) => out.querySelectorAll('[data-say]').forEach((b) => b.addEventListener('click', () => {
            if (Say.on) { Say.stop(); out.querySelectorAll('[data-say]').forEach((x) => { x.textContent = '🔊 ouvir'; }); setSt(''); return; }
            Listen.stop(); mic.classList.remove('on'); setSt('Falando…', 'say'); out.querySelectorAll('[data-say]').forEach((x) => { x.textContent = '⏹ parar'; });
            Say.speak(text, () => { out.querySelectorAll('[data-say]').forEach((x) => { x.textContent = '🔊 ouvir'; }); if (!dead) setSt(''); });
          }));
          const render = (d, viaVoice) => {
            doConfirm = null; doCancel = null;
            const itens = (Array.isArray(d.itens) ? d.itens : []).slice(0, 30);
            const ask = d.perguntas && d.perguntas.length ? `<div class="cmd-ask"><b>Preciso entender melhor:</b><ul>${d.perguntas.map((q) => `<li>${esc(q)}</li>`).join('')}</ul><span class="muted">Toque no microfone e responda, ou escreva acima.</span></div>` : '';
            const sayBtn = '<button type="button" class="btn sm ghost" data-say>🔊 ouvir</button>';
            let spoken = String(d.fala || d.resumo || '');
            if (d.intencao === 'mudanca') {
              const plan = this.plan(d); this.last = plan;
              let html = ask;
              if (!plan.items.length) html += `<p>${d.perguntas && d.perguntas.length ? '' : esc(d.resumo || 'Não achei nada para mudar com esse pedido.')}</p>`;
              else {
                html += `<div class="cmd-ah"><p class="cmd-sum">${esc(d.resumo || 'Vou fazer estas mudanças:')}</p>${sayBtn}</div><div class="cmd-list">${plan.items.map((x, i) => `<label class="cmd-it"><input type="checkbox" class="check" data-i="${i}" checked><span class="cmd-ic" aria-hidden="true">${x.icon}</span><span class="cmd-tx"><b>${esc(x.title)}</b><span>${this.label(x)}</span></span></label>`).join('')}</div>
                  <div class="row" style="margin-top:10px"><button type="button" class="btn" id="cmd-ok">Confirmar</button><button type="button" class="btn ghost" id="cmd-no">Cancelar</button></div>`;
                spoken = (d.fala || d.resumo || 'Vou fazer estas mudanças.') + ' Posso confirmar?';
              }
              if (plan.notes.length) html += `<p class="muted">${plan.notes.map(esc).join('<br>')}</p>`;
              out.innerHTML = html;
              const ok = $('#cmd-ok', form);
              if (ok) {
                doConfirm = () => { const pick = [...form.querySelectorAll('.cmd-it input:checked')].map((c) => plan.items[Number(c.dataset.i)]); Say.stop(); Listen.stop(); dlg.close(); if (!pick.length) { toast('Nada foi marcado.'); return; } this.apply(pick); };
                doCancel = () => { Say.stop(); Listen.stop(); out.innerHTML = '<p class="muted">Tudo bem, não mudei nada.</p>'; setSt(''); };
                ok.addEventListener('click', doConfirm); $('#cmd-no', form).addEventListener('click', doCancel);
              }
              bindSay(spoken);
              try { out.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
              speak(spoken, viaVoice && ok ? () => listen('confirm') : null);
              return;
            }
            // consulta: resposta prática, em lista
            out.innerHTML = `${ask}<div class="cmd-ans"><div class="cmd-ah"><h3>${esc(d.resumo || 'Aqui está')}</h3>${spoken ? sayBtn : ''}</div>${itens.length ? `<ul class="cmd-items">${itens.map((i) => `<li><b>${esc(i && i.texto)}</b>${i && i.detalhe ? `<span>${esc(i.detalhe)}</span>` : ''}</li>`).join('')}</ul>` : ''}</div>`;
            bindSay(spoken);
            try { out.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
            speak(spoken, viaVoice && d.perguntas && d.perguntas.length ? () => listen('ask') : null);
          };
          const submit = async (text, viaVoice) => {
            if (busy) return;
            text = String(text || '').trim();
            if (text.length < 3) { toast('Fale ou escreva o que você quer saber ou fazer.'); ta.focus(); return; }
            busy = true; go.disabled = true; Say.stop(); setSt('Pensando…', 'think'); out.innerHTML = '';
            try { const r = await this.ask(text); if (dead) return; setSt(''); render(r.data || r, viaVoice); }
            catch (e) {
              const c = e && e.code;
              setSt(''); out.innerHTML = `<p>${c === 'rate_limited' ? 'Você usou todos os pedidos de hoje. Amanhã libera de novo.' : c === 'unauthorized' ? 'Entre na sua conta para usar.' : c === 'not_found' || c === 'not_configured' ? 'Essa função ainda não está disponível. Tente mais tarde.' : 'Não consegui agora. Confira a internet e tente de novo.'}</p>`;
            } finally { busy = false; go.disabled = false; }
          };
          go.addEventListener('click', () => { Listen.stop(); mic.classList.remove('on'); submit(ta.value, false); });
          ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); Listen.stop(); mic.classList.remove('on'); submit(ta.value, false); } });
          mic.addEventListener('click', () => {
            if (mic.classList.contains('on')) { try { Listen.rec && Listen.rec.stop(); } catch (e) { /* já parou */ } return; } // tocar de novo = terminei
            Say.stop(); listen('ask');
          });
          if (o.listen) listen('ask');
        },
      });
    },
    // botão flutuante, na direita, que a pessoa pode arrastar para onde preferir
    pos() { try { return JSON.parse(localStorage.getItem(this.POS) || 'null'); } catch (e) { return null; } },
    place(el) {
      const p = this.pos() || { r: 14, b: matchMedia('(max-width: 820px)').matches ? 96 : 28 };
      const w = innerWidth, h = innerHeight, sz = 56;
      el.style.right = Math.min(Math.max(8, p.r), Math.max(8, w - sz - 8)) + 'px';
      el.style.bottom = Math.min(Math.max(8, p.b), Math.max(8, h - sz - 8)) + 'px';
    },
    mount() {
      if ($('#cmd-fab')) return;
      const b = document.createElement('button');
      b.id = 'cmd-fab'; b.type = 'button'; b.className = 'cmd-fab'; b.setAttribute('aria-label', 'Pedir pela voz: mover compromissos e conteúdos'); b.title = 'Pedir pela voz (arraste para mudar de lugar)';
      b.innerHTML = `${MIC_SVG}<span class="cmd-sp" aria-hidden="true">✦</span>`;
      document.body.appendChild(b); this.place(b);
      let st = null;
      b.addEventListener('pointerdown', (e) => { st = { x: e.clientX, y: e.clientY, r: parseFloat(b.style.right), b: parseFloat(b.style.bottom), moved: false }; try { b.setPointerCapture(e.pointerId); } catch (x) {} });
      b.addEventListener('pointermove', (e) => {
        if (!st) return;
        const dx = e.clientX - st.x, dy = e.clientY - st.y;
        if (!st.moved && Math.hypot(dx, dy) < 8) return;
        st.moved = true; b.classList.add('drag');
        b.style.right = Math.min(Math.max(8, st.r - dx), innerWidth - 56 - 8) + 'px';
        b.style.bottom = Math.min(Math.max(8, st.b - dy), innerHeight - 56 - 8) + 'px';
      });
      const end = () => {
        if (!st) return; const moved = st.moved; st = null; b.classList.remove('drag');
        if (moved) { try { localStorage.setItem(this.POS, JSON.stringify({ r: parseFloat(b.style.right), b: parseFloat(b.style.bottom) })); } catch (e) {} }
        else this.open({ listen: true });
      };
      b.addEventListener('pointerup', end);
      b.addEventListener('pointercancel', () => { st = null; b.classList.remove('drag'); });
      b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.open({ listen: true }); } });
      window.addEventListener('resize', () => this.place(b));
    },
  };

  if (location.protocol === 'file:') Cmd.mount(); // no navegador de testes, sem login
  Reminders.prune();
  Weather.load();
  setInterval(() => { if (!document.hidden) Weather.load(); }, 30 * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Weather.load(); });
  Reminders.tick();
  if (location.search.includes('job=')) { openFromUrl(location.href); try { history.replaceState(null, '', location.pathname + '#conteudo'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Assist.check(); });
  if (location.protocol === 'file:') window.__bloom = { Cmd, Listen, Say, Plan, Assist, Social, S: () => S, rerender: () => rerender() }; // só nos testes locais
  setTimeout(() => { Assist.check(); if ((Assist.st().jobs || []).length) Assist.watch(); }, 2500);
  if (location.search.includes('task=')) { openFromUrl(location.href); try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'open') openFromUrl(e.data.url); });
  Cloud.start();
  let lastDay = today();
  setInterval(() => {
    const c = document.getElementById('clock');
    if (c) c.textContent = nowHM();
    if (today() !== lastDay) { lastDay = today(); rerender(); }
    Reminders.tick();
  }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (today() !== lastDay) { lastDay = today(); rerender(); } Reminders.tick(); } });
})();
</script>
</body>
</html>
